      preview.appendChild(legend);
      if (problems.length) {
        btn.disabled = true; input.classList.add('bad');
        var grouped = [], seenP = {};
        problems.forEach(function (pr) {
          if (seenP[pr] == null) { seenP[pr] = grouped.length; grouped.push({ text: pr, n: 1 }); } else grouped[seenP[pr]].n += 1;
        });
        preview.appendChild(el('span', 'err', "Can't do that: " + grouped.map(function (g) { return g.text + (g.n > 1 ? ' (×' + g.n + ')' : ''); }).join('; ')));
      } else {
        btn.disabled = false;
      }
    }
    card._refreshPreview = function () { if (input.value.trim()) refreshPreview(); };

    function submit() {
      var parsed = parseCardSpec(input.value);
      if (parsed.error) { toast(parsed.error, true); return; }
      btn.disabled = true;
      postJson('/webhooks/dev-change-cards', { roomId: selectedRoomId, target_user: p.playerId, change_cards: parsed.cards }).then(function (result) {
        if (!result.success) {
          toast('Refused: ' + result.error, true);
          log('give cards to ' + p.playerName + ': ' + result.error, true);
          btn.disabled = false;
        } else {
          toast(p.playerName + ' now holds ' + result.hand.map(cardLabel).join(' '));
          log('gave ' + p.playerName + ': ' + result.hand.map(cardLabel).join(' '));
          input.value = '';
          refreshPreview();
        }
        loadDetail(true);
      }).catch(function (e) {
        toast('Failed: ' + e.message, true);
        log('give cards to ' + p.playerName + ': ' + e.message, true);
        btn.disabled = false;
      });
    }
    input.addEventListener('input', refreshPreview);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !btn.disabled) submit();
      if (e.key === 'Escape') { input.value = ''; refreshPreview(); input.blur(); }
    });
    btn.onclick = submit;
    clear.onclick = function () { input.value = ''; refreshPreview(); input.focus(); };
    return card;
  }

  // ---- the story (game logs) ------------------------------------------------------
  //
  // One game's server log, live-tailed. The server keeps every line it can
  // attribute to a room for GAME_LOG_RETENTION_MS (>= 2h) after the last line,
  // so a finished game stays readable here. `since` is a seq cursor: follow
  // mode only pulls what arrived after the last line we rendered.
  //
  // Story mode asks the server for the narrative subset ([GAME] events,
  // lifecycle events, warn/error) and renders each as a sentence with cards;
  // Raw mode is every line as logged.

  var gameLogs = (function () {
    var roomId = null;
    var since = 0;
    var timer = null;
    var loading = false;
    var listTimer = null;
    var human = true;
    var MAX_DOM_LINES = 3000;
    var names = {}; // playerId -> name, and 'seat:N' -> name, learned from the log itself

    var view = $('logview');
    var roomSel = $('logs-room');
    var meta = null;

    function learnNames(e) {
      var d = e._data;
      if (d && d.game === 'deal' && Array.isArray(d.seats)) {
        d.seats.forEach(function (s) {
          if (s.name) { names[String(s.playerId)] = s.name; names['seat:' + s.seat] = s.name; }
        });
      }
      var m = e.msg.match(/Player (\S+) \(([^)]+)\) joined room/);
      if (m) names[m[1]] = m[2];
      if (lastDetail && lastDetail.roomId === roomId) {
        (lastDetail.players || []).forEach(function (p) {
          names[String(p.playerId)] = p.playerName;
          names['seat:' + p.playerIndex] = p.playerName;
        });
      }
    }

    // `suffix` rides inside the <b> so flex gaps never split "Bob" from "'s".
    function who(d, suffix) {
      var n = (d.playerId != null && names[String(d.playerId)]) || (d.seat != null && names['seat:' + d.seat]);
      var b = el('b', null, (n || (d.playerId != null ? String(d.playerId) : 'seat ' + d.seat)) + (suffix || ''));
      if (n && d.seat != null) b.title = 'seat ' + d.seat + ' · ' + d.playerId;
      return b;
    }

    function seatRef(seat, suffix) {
      var n = names['seat:' + seat];
      return el('b', null, (n ? n : 'seat ' + seat) + (suffix || ''));
    }
    function seatName(seat) { return names['seat:' + seat] || ('seat ' + seat); }

    function cards(list) {
      var c = el('span', 'fan');
      (list || []).forEach(function (card) { c.appendChild(cardFace(card, 'xs')); });
      return c;
    }

    function scoreText(obj) {
      if (!obj) return '';
      return Object.keys(obj).map(function (k) { return teamName(k) + ' ' + obj[k]; }).join(', ');
    }

    // Returns { icon, cls, parts: [...nodes], divider?: string } for a [GAME] event.
    function describeGame(d) {
      var parts = [];
      var r = { icon: '•', cls: '', parts: parts };
      switch (d.game) {
        case 'deal':
          r.icon = '🃏'; r.cls = 'turn';
          parts.push(txt('Round ' + (d.round || 1) + ' dealt'));
          if (Array.isArray(d.seats)) parts.push(txt(' — ' + d.seats.map(function (s) { return (s.name || s.playerId) + ' gets ' + s.cards; }).join(', ')));
          parts.push(txt(' · ' + d.deck + ' in the deck · wells ' + (d.wells || []).join(' / ')));
          if (d.firstTurn != null) r.divider = seatName(d.firstTurn) + ' starts';
          break;
        case 'draw':
          r.icon = d.auto ? '⏰' : '🂠';
          parts.push(who(d)); parts.push(txt(d.auto ? ' timed out — a card was drawn for them: ' : ' drew '));
          parts.push(cards([d.card]));
          parts.push(txt(' · ' + d.deck + ' left in the deck · holds ' + d.hand));
          break;
        case 'discard':
          r.icon = d.auto ? '⏰' : '🗑';
          parts.push(who(d)); parts.push(txt(d.auto ? ' timed out — discarded for them: ' : ' discarded '));
          parts.push(cards([d.card]));
          parts.push(txt(' · holds ' + d.hand));
          if (d.pozzettoTaken) parts.push(txt(' · hand emptied → picked up a well (' + d.pozzettoTaken + ' cards)'));
          if (d.minimumMeldFailed) parts.push(txt(' · minimum-meld check failed, this turn\'s melds went back'));
          if (d.meldsReturned) parts.push(txt(' · ' + d.meldsReturned + ' melded card(s) had to be taken back first'));
          if (d.nextSeat != null) r.divider = seatName(d.nextSeat) + "'s turn";
          break;
        case 'meld':
          r.icon = '🧩';
          parts.push(who(d)); parts.push(txt(' laid down '));
          parts.push(cards(d.cards));
          if (d.isBuraco) parts.push(el('span', 'badge tiny buraco', 'BURACO' + (d.grade ? ' · ' + d.grade : '')));
          else if (d.grade) parts.push(el('span', 'badge tiny neutral', d.grade));
          parts.push(txt(' · holds ' + d.hand));
          if (d.pozzettoTaken) parts.push(txt(' · hand emptied → picked up a well (' + d.pozzettoTaken + ')'));
          break;
        case 'go_down':
          r.icon = '🧩';
          parts.push(who(d)); parts.push(txt(' went down with ' + plural((d.melds || []).length, 'meld') + ': '));
          (d.melds || []).forEach(function (m) { parts.push(cards(m)); });
          parts.push(txt(' · holds ' + d.hand));
          if (d.pozzettoTaken) parts.push(txt(' · picked up a well (' + d.pozzettoTaken + ')'));
          break;
        case 'add_to_meld':
          r.icon = '➕';
          parts.push(who(d)); parts.push(txt(' added ')); parts.push(cards(d.cards));
          parts.push(txt(' to ')); parts.push(seatRef(d.targetSeat, "'s")); parts.push(txt('meld ' + (d.targetMeldIndex + 1) + ' · holds ' + d.hand));
          if (d.pozzettoTaken) parts.push(txt(' · picked up a well (' + d.pozzettoTaken + ')'));
          break;
        case 'take_pile':
          r.icon = '📥';
          parts.push(who(d)); parts.push(txt(' picked up the discard pile (' + plural((d.cards || []).length, 'card') + ') '));
          parts.push(cards(d.cards)); parts.push(txt(' · holds ' + d.hand));
          break;
        case 'take_pozzetto':
          r.icon = '🎁';
          parts.push(who(d)); parts.push(txt(' took a well (' + plural((d.cards || []).length, 'card') + ') · holds ' + d.hand));
          break;
        case 'timeout':
          r.icon = '⏰'; r.cls = 'WARN';
          parts.push(who(d)); parts.push(txt('ran out of time' + (d.connected === false ? ' (offline)' : '') + (d.isBot ? ' (bot)' : '')));
          break;
        case 'turn_forced':
          r.icon = '⏭'; r.cls = 'WARN';
          parts.push(txt('nothing could be discarded — the turn was skipped from ')); parts.push(seatRef(d.fromSeat)); parts.push(txt(' to ')); parts.push(seatRef(d.toSeat));
          r.divider = seatName(d.toSeat) + "'s turn";
          break;
        case 'round_end':
        case 'match_end':
          r.icon = d.game === 'match_end' ? '🏆' : '🏁'; r.cls = 'end';
          parts.push(txt((d.game === 'match_end' ? 'Match over' : 'Round ' + (d.round || '') + ' over') + ' — '));
          if (d.winnerSeat != null) { parts.push(seatRef(d.winnerSeat)); parts.push(txt(' went out')); }
          if (d.batida) parts.push(txt(' (' + d.batida + ')'));
          if (d.teamScores) parts.push(txt(' · this round: ' + scoreText(d.teamScores)));
          if (d.cumulative) parts.push(txt(' · match: ' + scoreText(d.cumulative) + (d.targetScore ? ' (playing to ' + d.targetScore + ')' : '')));
          break;
        case 'disconnect':
          r.icon = '🔌'; r.cls = 'WARN';
          parts.push(who(d)); parts.push(txt(' lost connection (' + (d.reason || '?') + ')' + (d.inProgress ? ' mid-game' : '')));
          break;
        case 'reconnect':
          r.icon = '🔄';
          parts.push(who(d)); parts.push(txt(' is back'));
          break;
        case 'leave':
          r.icon = '🚪';
          parts.push(who(d)); parts.push(txt(' left the room · ' + plural(d.remaining, 'player') + ' remaining'));
          break;
        case 'forfeit':
          r.icon = '🏳'; r.cls = 'end';
          parts.push(who(d)); parts.push(txt(' forfeited (' + d.reason + ')'));
          if (d.winnerSeat != null) { parts.push(txt(' · ')); parts.push(seatRef(d.winnerSeat)); parts.push(txt(' wins')); }
          break;
        default:
          parts.push(txt(d.game + ' ' + JSON.stringify(d)));
      }
      return r;
    }

    var LIFE_TEXT = {
      room_created: 'room created', room_synced_from_backend: 'room synced from the backend',
      join_requested: 'asked to join', player_joined: 'joined', spectator_joined: 'joined as a spectator',
      bot_invited: 'bot invited', bot_joined: 'bot seated', start_triggered_by_webhook: 'backend asked to start',
      game_started_manual: 'game started by the host', game_started_auto_full_room: 'game started (room full)',
      next_round_scheduled: 'next round scheduled', next_round_started: 'next round started',
      next_round_cancelled: 'next round cancelled', next_round_aborted: 'match aborted before the next round',
      room_cancelled_by_backend: 'room cancelled by the backend', host_heartbeat_kill: 'lobby closed — host stopped responding',
      start_rejected_incomplete_roster: 'start refused — seats missing', seat_claim_rejected: 'seat claim refused',
    };

    function humanEl(e) {
      var d = e._data;
      var wrap = el('div', 'ev ' + e.level);
      wrap.appendChild(el('span', 't', fmtTime(e.ts)));
      var ic = el('span', 'ic', '•');
      var body = el('span', 'body');
      wrap.appendChild(ic); wrap.appendChild(body);

      if (d && d.game && e.msg.indexOf('[GAME]') === 0) {
        var r = describeGame(d);
        ic.textContent = r.icon;
        if (r.cls) wrap.classList.add(r.cls);
        r.parts.forEach(function (n) { body.appendChild(n); });
        wrap._divider = r.divider || null;
        return wrap;
      }
      if (d && d.event && e.msg.indexOf('[ROOM_LIFECYCLE]') === 0) {
        wrap.classList.add('life');
        ic.textContent = '·';
        var text = LIFE_TEXT[d.event] || String(d.event).replace(/_/g, ' ');
        if (d.playerId != null) {
          body.appendChild(el('b', null, names[String(d.playerId)] || String(d.playerId)));
          body.appendChild(txt(' ' + text));
        } else {
          body.appendChild(txt(text));
        }
        var bits = [];
        if (d.playerIndex != null) bits.push('seat ' + d.playerIndex);
        if (d.reason) bits.push(d.reason);
        if (d.playerCount != null) bits.push(d.playerCount + '/' + (d.maxPlayers || '?') + ' seated');
        if (d.delayMs != null) bits.push('in ' + Math.round(d.delayMs / 1000) + 's');
        if (bits.length) body.appendChild(el('span', 'seat', '— ' + bits.join(' · ')));
        return wrap;
      }
      if (d && d.game == null && e.msg.indexOf('[DEV_CHANGE_CARDS]') === 0) {
        ic.textContent = '🛠';
        if (d.swap) {
          body.appendChild(txt('an admin swapped '));
          body.appendChild(cards([d.a]));
          body.appendChild(txt(' (' + d.a.from + ') with '));
          body.appendChild(cards([d.b]));
          body.appendChild(txt(' (' + d.b.from + ')'));
        } else {
          body.appendChild(txt('an admin gave '));
          body.appendChild(who(d));
          body.appendChild(txt(' a new hand (' + plural(d.requested, 'card') + ') · ' + d.deckCount + ' left in the deck'));
        }
        return wrap;
      }
      ic.textContent = e.level === 'ERROR' ? '✖' : e.level === 'WARN' ? '⚠' : '·';
      var m = e.msg.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
      if (m) {
        body.appendChild(el('span', 'tag', m[1]));
        body.appendChild(txt(m[2]));
      } else {
        body.appendChild(txt(e.msg));
      }
      if (e.data && !d) body.appendChild(el('span', 'sub', e.data));
      return wrap;
    }

    function rawEl(e, needle) {
      var div = el('div', 'ln ' + e.level);
      div.appendChild(el('span', 't', fmtTime(e.ts) + ' '));
      div.appendChild(el('span', 'lv', e.level));
      div.appendChild(el('span', 'm', ' ' + e.msg));
      if (e.data) div.appendChild(el('span', 'd', e.data));
      if (needle && (e.msg + ' ' + (e.data || '')).toLowerCase().indexOf(needle) !== -1) div.classList.add('hit');
      return div;
    }

    function parseEntry(e) {
      e._data = null;
      if (e.data) { try { var d = JSON.parse(e.data); if (d && typeof d === 'object') e._data = d; } catch (x) { /* raw */ } }
      return e;
    }

    function query() {
      return { level: $('logs-level').value, q: $('logs-q').value.trim() };
    }

    function renderMeta() {
      var parts = [];
      if (!meta) { $('logs-meta').textContent = ''; return; }
      parts.push('room ' + meta.roomId + (meta.live ? (meta.roomStatus === 'waiting' ? ' · in the lobby' : ' · playing now') : ' · finished'));
      if (meta.firstAt) parts.push('from ' + fmtTime(meta.firstAt));
      if (meta.lastAt) parts.push('to ' + fmtTime(meta.lastAt));
      parts.push('showing ' + view.querySelectorAll('.ln, .ev').length + ' of ' + meta.total + (human ? ' story lines' : ' lines'));
      if (meta.dropped) parts.push(meta.dropped + ' oldest lines already dropped');
      if (meta.restored) parts.push('restored from disk after a restart');
      $('logs-meta').textContent = parts.join('   ·   ');
    }

    function atBottom() {
      return view.scrollHeight - view.scrollTop - view.clientHeight < 40;
    }

    function append(entries, needle, stickToBottom) {
      var frag = document.createDocumentFragment();
      entries.forEach(function (e) {
        parseEntry(e);
        learnNames(e);
        var node = human ? humanEl(e) : rawEl(e, needle);
        frag.appendChild(node);
        if (human && node._divider) frag.appendChild(el('div', 'divider', node._divider));
      });
      view.appendChild(frag);
      var lines = view.querySelectorAll('.ln, .ev, .divider');
      for (var i = 0; i < lines.length - MAX_DOM_LINES; i++) view.removeChild(lines[i]);
      if (stickToBottom) view.scrollTop = view.scrollHeight;
    }

    function fetchPage(params) {
      if (human) params.narrative = 1;
      var qs = Object.keys(params).filter(function (k) { return params[k] !== '' && params[k] != null; })
        .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
      return api('/dev/api/rooms/' + encodeURIComponent(roomId) + '/logs' + (qs ? '?' + qs : ''));
    }

    function reload() {
      if (!roomId || loading) return;
      loading = true;
      var q = query();
      view.innerHTML = '';
      view.classList.toggle('human', human);
      view.classList.toggle('raw', !human);
      since = 0;
      names = {};
      fetchPage({ tail: 1, limit: human ? 2000 : 800, level: q.level, q: q.q }).then(function (res) {
        loading = false;
        if (!res.success) {
          meta = null; renderMeta();
          view.innerHTML = '<div class="empty">' + (res.error || 'no log for this room') + '</div>';
          $('btn-logs-download').disabled = true;
          return;
        }
        if (!res.entries.length) view.innerHTML = '<div class="empty">nothing matches</div>';
        append(res.entries, q.q.toLowerCase(), true);
        since = res.nextSince || 0;
        meta = res;
        renderMeta();
        $('btn-logs-download').disabled = false;
      }).catch(function (e) {
        loading = false;
        view.innerHTML = '<div class="empty">' + e.message + '</div>';
        meta = null; renderMeta();
        $('btn-logs-download').disabled = true;
      });
    }

    function tick() {
      if (!roomId || loading || !$('logs-follow').checked || !secret || restarting) return;
      if (!$('pane-logs').classList.contains('active')) return; // hidden tab: don't burn requests
      loading = true;
      var q = query();
      var stick = atBottom();
      fetchPage({ since: since, limit: 500, level: q.level, q: q.q }).then(function (res) {
        loading = false;
        if (!res.success) return;
        if (res.entries.length) {
          var placeholder = view.querySelector('.empty');
          if (placeholder) view.removeChild(placeholder);
          append(res.entries, q.q.toLowerCase(), stick);
          since = res.nextSince;
        }
        if (meta && meta.roomId === res.roomId) {
          meta.live = res.live;
          meta.roomStatus = res.roomStatus;
          meta.lastAt = res.lastAt;
          meta.dropped = res.dropped;
          meta.total += res.entries.length;
          renderMeta();
        }
      }).catch(function () { loading = false; });
    }

    function refreshList() {
      if (!secret) return;
      api('/dev/api/logs').then(function (res) {
        var rooms = res.rooms || [];
        var current = roomSel.value;
        roomSel.innerHTML = '<option value="">— pick a game (' + rooms.length + ') —</option>';
        rooms.forEach(function (r) {
          var opt = document.createElement('option');
          opt.value = r.roomId;
          var bits = [r.roomId, r.live ? (r.roomStatus === 'waiting' ? 'lobby' : 'playing') : 'finished'];
          if (r.count != null) bits.push(plural(r.count, 'line'));
          if (r.errors) bits.push(plural(r.errors, 'error'));
          if (r.warns) bits.push(plural(r.warns, 'warning'));
          if (r.onDisk) bits.push('on disk');
          bits.push(fmtTime(r.lastAt).slice(0, 8));
          opt.textContent = bits.join(' · ');
          roomSel.appendChild(opt);
        });
        roomSel.value = roomId || current || '';
        renderEnded(rows);
        if (res.retentionMs) {
          $('logs-retention').textContent = 'kept ' + Math.round(res.retentionMs / 3600000 * 10) / 10 + 'h after the last line';
        }
      }).catch(function () { /* transient */ });
    }

    // opts.quiet: point the tab at the room without switching to it / scrolling.
    function open(id, opts) {
      if (!id) return;
      opts = opts || {};
      if (String(id) === roomId && opts.quiet) return;
      roomId = String(id);
      roomSel.value = roomId;
      if (roomSel.value !== roomId) refreshList(); // not in the picker yet (fresh game)
      $('logs-room-manual').value = '';
      reload();
      if (!timer) timer = setInterval(tick, 1500);
      if (!opts.quiet) $('workspace').scrollIntoView({ block: 'start' });
    }

    function start() {
      refreshList();
      if (!listTimer) listTimer = setInterval(refreshList, 5000);
      if (!timer) timer = setInterval(tick, 1500);
    }

    function stop() {
      if (timer) { clearInterval(timer); timer = null; }
      if (listTimer) { clearInterval(listTimer); listTimer = null; }
    }

    function setMode(h) {
      human = h;
      $('mode-human').classList.toggle('active', h);
      $('mode-raw').classList.toggle('active', !h);
      reload();
    }
    $('mode-human').onclick = function () { setMode(true); };
    $('mode-raw').onclick = function () { setMode(false); };

    roomSel.onchange = function () { if (roomSel.value) open(roomSel.value); };
    $('btn-logs-open').onclick = function () {
      var v = $('logs-room-manual').value.trim();
      if (v) open(v);
    };
    $('logs-room-manual').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('btn-logs-open').click();
    });
    $('logs-level').onchange = reload;
    var qDebounce = null;
    $('logs-q').addEventListener('input', function () {
      clearTimeout(qDebounce);
      qDebounce = setTimeout(reload, 350);
    });
    $('btn-logs-reload').onclick = reload;
    $('btn-logs-download').onclick = function () {
      if (!roomId) return;
      var q = query();
      var params = ['secret=' + encodeURIComponent(secret)];
      if (q.level) params.push('level=' + encodeURIComponent(q.level));
      if (q.q) params.push('q=' + encodeURIComponent(q.q));
      window.open('/dev/api/rooms/' + encodeURIComponent(roomId) + '/logs.txt?' + params.join('&'), '_blank');
    };

    // The pane was display:none while it loaded, so the "stick to bottom"
    // scroll had nothing to measure — redo it now that it is visible.
    function onShown() {
      if ($('logs-follow').checked) view.scrollTop = view.scrollHeight;
    }

    return { open: open, start: start, stop: stop, onShown: onShown };
  })();

  // ---- polling ----------------------------------------------------------------------

  function poll() {
    if (!secret || restarting) return;
    api('/dev/api/status').then(renderStatus).catch(function (e) {
      if (e.status === 401) { toast('Wrong webhook secret', true); stopPolling(); }
    });
    api('/dev/api/rooms').then(function (body) {
      renderRooms(body);
      $('rooms-refresh').textContent = '· refreshes every 2s · ' + new Date().toLocaleTimeString();
      if (selectedRoomId) {
        var still = body.rooms.some(function (r) { return r.roomId === selectedRoomId; });
        if (!still) {
          clearDetail();
          $('detail-empty').textContent = 'this game is over and has been cleaned up — its story is in the Story tab';
        } else {
          loadDetail(false);
        }
      }
    }).catch(function (e) {
      if (e.status === 401) { stopPolling(); }
      log('rooms: ' + e.message, true);
    });
  }

  function startPolling() {
    stopPolling();
    poll();
    pollTimer = setInterval(poll, 2000);
    gameLogs.start();
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    gameLogs.stop();
  }

  $('btn-ops').onclick = function () { $('ops-modal').classList.add('show'); };
  $('btn-ops-close').onclick = function () { $('ops-modal').classList.remove('show'); };
  $('ops-modal').addEventListener('click', function (e) { if (e.target === $('ops-modal')) $('ops-modal').classList.remove('show'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('ops-modal').classList.remove('show'); swapClear(); }
  });

  $('detail-pause').onchange = function () {
    if (!this.checked) loadDetail(true);
    toast(this.checked ? 'Table refresh paused' : 'Table refresh resumed');
  };

  // ---- ops actions --------------------------------------------------------------------

  function opsMessage() {
    var m = $('ops-message').value.trim();
    return m ? { message: m } : {};
  }

  function broadcast(payload, label) {
    return postJson('/webhooks/development', payload).then(function (result) {
      if (!result.success) {
        toast(label + ': ' + result.error, true);
        log(label + ' rejected: ' + result.error, true);
      } else {
        toast(label + ' broadcast sent.');
        log(label + ' → ' + JSON.stringify(payload));
      }
      poll();
    }).catch(function (e) {
      toast(label + ' failed: ' + e.message, true);
      log(label + ': ' + e.message, true);
    });
  }

  $('btn-maint-on').onclick = function () {
    broadcast(Object.assign({ maintenance_mode: true }, opsMessage()), 'Maintenance ON');
  };
  $('btn-maint-off').onclick = function () {
    broadcast({ maintenance_mode: false, restart_server: false }, 'All clear');
  };
  $('btn-restart-announce').onclick = function () {
    broadcast(Object.assign({ restart_server: true }, opsMessage()), 'Restart announce');
  };
  // Two ways down, one webhook. Without `keep_sessions` the server broadcasts
  // `development { restart_server: true }` first — every client leaves the
  // table — and then exits. With it, the server sends `server_restarting`,
  // snapshots every room and exits; clients keep the table and rejoin on the
  // next boot (docs/RESTART_RESILIENCE.md). Both come back only under a
  // supervisor.
  function restartProcess(keepSessions) {
    var question = keepSessions
      ? 'Restart the server process and KEEP every live table?\n' +
        'Clients get server_restarting, rooms are snapshotted and held on the next boot.\n' +
        'It comes back only if a supervisor (pm2/systemd/docker) is running it.'
      : 'Broadcast a restart notice (every client LEAVES the table) and shut the server process down?\n' +
        'It comes back only if a supervisor (pm2/systemd/docker) is running it.';
    if (!confirm(question)) return;
    restarting = true;
    var payload = Object.assign({ shutdown_after_ms: 3000 }, opsMessage());
    if (keepSessions) payload.keep_sessions = true;
    postJson('/webhooks/dev-restart', payload).then(function (result) {
      if (!result.success) {
        restarting = false;
        toast('Restart rejected: ' + result.error, true);
        return;
      }
      log('dev-restart' + (keepSessions ? ' (keep sessions)' : '') +
          ': notice sent, process exits in ' + result.shutdownInMs + 'ms');
      toast('Restarting — server goes down in ' + (result.shutdownInMs / 1000) + 's.');
      document.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      setTimeout(function () { window.location.reload(); }, 12000);
    }).catch(function (e) {
      restarting = false;
      toast('Restart failed: ' + e.message, true);
      log('dev-restart: ' + e.message, true);
    });
  }
  $('btn-restart-real').onclick = function () { restartProcess(false); };
  $('btn-restart-keep').onclick = function () { restartProcess(true); };

  // ---- connect ------------------------------------------------------------------------

  secretInput.value = secret;
  $('btn-save-secret').onclick = function () {
    secret = secretInput.value.trim();
    localStorage.setItem(SECRET_KEY, secret);
    if (secret) { startPolling(); toast('Connected — polling rooms.'); }
    else { stopPolling(); toast('Secret cleared.'); }
  };
  secretInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('btn-save-secret').click();
  });

  if (secret) startPolling();
})();
</script>
</body>
</html>
