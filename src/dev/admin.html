<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brazilia — Dev Console</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel2: #1c232e;
    --panel3: #222b38;
    --border: #2a3342;
    --text: #e6ebf2;
    --muted: #8b98ab;
    --accent: #4f8cff;
    --danger: #ff5d5d;
    --warn: #ffb454;
    --ok: #3dd68c;
    --felt: #1f4a3a;
    --felt2: #275e49;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 12px 20px;
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .4px; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  .secret-box { display: flex; gap: 8px; align-items: center; }
  .secret-box label { color: var(--muted); font-size: 12px; }
  input[type=text], input[type=password], select {
    background: var(--panel3); color: var(--text); border: 0;
    border-radius: 8px; padding: 8px 11px; font-size: 13px; outline: none; font-family: var(--sans);
  }
  input[type=text], input[type=password] { min-width: 200px; }
  input:focus, select:focus { box-shadow: 0 0 0 2px rgba(79,140,255,.45); }
  input.bad { box-shadow: 0 0 0 2px rgba(255,93,93,.6); }
  button {
    background: var(--panel3); color: var(--text); border: 0;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; font-family: var(--sans);
  }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.warn { background: var(--warn); border-color: var(--warn); color: #20140a; }
  button.small { padding: 4px 10px; font-size: 12px; }
  button.ghost { background: transparent; }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  /* ---- sidebar: game list ---- */
  .sidebar { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; }
  .room-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 10px 12px; margin-bottom: 4px; cursor: pointer; color: var(--text); font: inherit; }
  .room-item:hover { background: var(--panel); filter: none; }
  .room-item.selected { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .room-item .r1 { display: flex; align-items: center; gap: 8px; }
  .room-item .rid { font-family: var(--mono); font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room-item .r2 { font-size: 12.5px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-item .r3 { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .room-item.ended { opacity: .8; }
  .side-h { font-size: 13px; color: var(--muted); margin: 18px 0 8px 12px; display: flex; align-items: center; gap: 8px; }
  .side-h:first-child { margin-top: 0; }
  /* ---- ops modal ---- */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: none; align-items: flex-start; justify-content: center; padding: 60px 16px; overflow-y: auto; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; width: min(760px, 100%); padding: 16px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal .mh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .modal .mh h3 { margin: 0; font-size: 15px; }
  .modal .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .modal .grid2 { grid-template-columns: 1fr; } }
  .modal .status-grid { grid-template-columns: repeat(2, 1fr); }
  /* ---- card selection (click-to-swap) ---- */
  .cf[data-cid], .pc[data-cid].pick { cursor: pointer; }
  .cf[data-cid]:hover, .pc.pick:hover { outline: 2px solid rgba(79,140,255,.6); outline-offset: 1px; }
  .cf.sel, .pc.sel { outline: 3px solid #F5C451 !important; outline-offset: 1px; box-shadow: 0 0 0 5px rgba(245,196,81,.25) !important; }
  .swapbar { position: sticky; bottom: 0; z-index: 12; display: none; align-items: center; gap: 10px; background: #2b2140; border-radius: 10px; padding: 8px 12px; margin-top: 10px; font-size: 13px; }
  .swapbar.show { display: flex; }
  .swapbar b { color: #F5C451; }
  details.pools { margin-bottom: 10px; }
  details.pools summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  details.pools summary::-webkit-details-marker { display: none; }
  details.pools summary::before { content: '▸'; color: var(--muted); font-size: 12px; }
  details.pools[open] summary::before { content: '▾'; }
  details.pools summary .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
  .pools-body { margin-top: 8px; }
  .player-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 10px; }
  details.typehand summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; margin-top: 8px; }
  details.typehand summary::-webkit-details-marker { display: none; }
  details.typehand summary::before { content: '▸ '; font-size: 11px; }
  details.typehand[open] summary::before { content: '▾ '; }
  details.typehand .how { margin-top: 6px; }
  .panel { background: var(--panel); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 13px; color: var(--muted); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 500; }
  .panel h2 .hint { text-transform: none; letter-spacing: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { background: var(--panel2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 14px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.on { background: rgba(255,93,93,.18); color: #ffb3b3; }
  .badge.off { background: rgba(61,214,140,.16); color: var(--ok); }
  .badge.neutral { background: var(--panel3); color: var(--muted); }
  .badge.live { background: rgba(61,214,140,.16); color: var(--ok); }
  .badge.waiting { background: rgba(255,180,84,.16); color: var(--warn); }
  .badge.ended { background: var(--panel3); color: var(--muted); }
  .badge.teamA { background: rgba(79,140,255,.2); color: #9dbdff; }
  .badge.teamB { background: rgba(255,180,84,.2); color: #ffd28a; }
  .badge.buraco { background: rgba(61,214,140,.2); color: var(--ok); }
  .badge.dirty { background: rgba(255,93,93,.18); color: #ffb3b3; }
  .badge.tiny { padding: 1px 7px; font-size: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid rgba(42,51,66,.5); font-size: 13px; vertical-align: middle; }
  td.id { font-family: var(--mono); font-size: 12px; }
  tr.room-row { cursor: pointer; }
  tr.room-row:hover td { background: var(--panel2); }
  tr.room-row.selected td { background: rgba(79,140,255,.12); }
  tr.room-row td.actions { text-align: right; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12px; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .log { font-family: var(--mono); font-size: 11px; color: var(--muted); max-height: 160px; overflow-y: auto; background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
  .log .ok { color: var(--ok); }
  .log .err { color: var(--danger); }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; font-size: 13px; }
  a { color: var(--accent); }
  .toast {
    position: fixed; bottom: 18px; right: 18px; z-index: 20;
    background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; max-width: 380px;
    box-shadow: 0 6px 24px rgba(0,0,0,.4); display: none;
  }
  .toast.err { border-left-color: var(--danger); }
  .toast.show { display: block; }

  /* ---- workspace tabs ---- */
  .ws-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .ws-head .title { font-size: 13px; color: var(--muted); }
  .ws-head .room-id { font-family: var(--mono); font-size: 13px; }
  .tabs { display: inline-flex; background: var(--panel2); border-radius: 9px; padding: 3px; gap: 2px; }
  .tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; color: var(--muted); font-size: 12.5px; }
  .tabs button.active { background: var(--panel3); color: var(--text); }
  .tabs button:hover:not(.active) { color: var(--text); filter: none; }
  .tabs.sm button { padding: 3px 10px; font-size: 12px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }

  /* ---- 1:1 board (geometry from the mobile TableGeometry, ocean palette) ---- */
  .board-wrap { position: relative; }
  .board {
    position: relative; width: 100%; aspect-ratio: 852 / 393; overflow: hidden;
    background: #16272B; border-radius: 14px;
    font-family: var(--sans); user-select: none;
  }
  .board * { box-sizing: border-box; }
  .felt {
    position: absolute; border-radius: calc(20px * var(--u)); border: calc(5px * var(--u)) solid #5E858E;
    background: radial-gradient(ellipse at 50% 18%, rgba(234,241,242,.55) 0%, rgba(234,241,242,0) 78%), #9FC0C6;
  }
  .felt .divider { position: absolute; left: 50%; width: calc(3px * var(--u)); background: rgba(35,67,75,.28); transform: translateX(-50%); }
  /* playing card, mobile face style: #F7F6F3 face, #9AA0A8 rim, radius 10/217 */
  .pc {
    position: absolute; background: #F7F6F3; border-radius: 6.5%/4.6%; box-shadow: 0 1px 2px rgba(0,0,0,.35);
    border: 1px solid #9AA0A8; overflow: hidden; color: #17181c; line-height: 1;
  }
  .pc.red { color: #C62828; }
  .pc .ix { position: absolute; left: 7%; top: 4%; font-weight: 700; font-size: calc(var(--ch) * .27); letter-spacing: -.03em; font-family: var(--sans); }
  .pc .ix.wide { font-size: calc(var(--ch) * .21); top: 6%; }
  .pc .ixs { display: none; }
  .pc .ixb { position: absolute; left: 8%; top: 31%; font-size: calc(var(--ch) * .22); }
  .pc .pip { position: absolute; right: 8%; bottom: 6%; font-size: calc(var(--ch) * .32); opacity: .9; }
  .pc .pip.n { font-size: calc(var(--ch) * .3); }
  .pc .pip.n small { display: none; }
  .pc img.court { position: absolute; right: 4%; bottom: 4%; width: 60%; height: auto; border-radius: 4px; }
  .pc.joker { color: #6b4b12; }
  .pc.joker .ix { font-size: calc(var(--ch) * .13); top: 6%; letter-spacing: 0; font-weight: 800; }
  .pc.covered .pip, .pc.covered img.court { display: none; }
  .pc.lock { box-shadow: 0 0 0 calc(3px * var(--u)) #F5C451, 0 1px 2px rgba(0,0,0,.35); }
  .pc.top { box-shadow: 0 0 0 calc(3px * var(--u)) #2F8FE0, 0 1px 2px rgba(0,0,0,.35); }
  .pc.restrict { box-shadow: 0 0 0 calc(3px * var(--u)) #FF7043, 0 1px 2px rgba(0,0,0,.35); }
  /* deck back (mobile DeckComponent): blue gradient, inner white rim, centre disc */
  .deckback {
    position: absolute; border-radius: 8%/6%; background: linear-gradient(135deg, #0D47A1, #1976D2);
    box-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  .deckback::before { content: ''; position: absolute; inset: 4%; border: 2px solid rgba(255,255,255,.5); border-radius: inherit; }
  .deckback::after { content: ''; position: absolute; left: 50%; top: 50%; width: 33%; padding-top: 33%; background: rgba(255,255,255,.2); border-radius: 50%; transform: translate(-50%, -50%); }
  .cntbadge {
    position: absolute; background: #fff; color: #111; border-radius: 999px; font-weight: 800; text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; font-family: var(--sans);
  }
  .well { position: absolute; border-radius: 8%/6%; background: #2E7D32; box-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .well::before { content: ''; position: absolute; inset: 4%; border: 2px solid rgba(255,255,255,.5); border-radius: inherit; }
  .well.taken { background: rgba(255,255,255,.05); box-shadow: none; }
  .well.taken::before { border-color: rgba(255,255,255,.2); }
  .discardbox { position: absolute; background: rgba(255,255,255,.2); border-radius: calc(10px * var(--u)); }
  /* nameplate: avatar circle + name below, white bold with dark halo */
  .plate { position: absolute; display: flex; flex-direction: row; align-items: center; gap: 8px; pointer-events: none; z-index: 70; background: rgba(10,14,20,.55); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 3px 12px 3px 3px; }
  .plate.turn { border-color: rgba(47,143,224,.9); box-shadow: 0 0 0 2px rgba(47,143,224,.25), 0 0 14px rgba(47,143,224,.35); }
  .plate .av {
    border-radius: 50%; background: rgba(21,16,36,.9); color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; position: relative; flex: none;
  }
  .plate .av.bot { background: #1D4E73; }
  .plate .av.clock { background: #fff; color: #111; font-variant-numeric: tabular-nums; }
  .plate .av.clock .ring { position: absolute; inset: 0; border-radius: 50%; -webkit-mask: radial-gradient(circle, transparent 0 66%, #000 67%); mask: radial-gradient(circle, transparent 0 66%, #000 67%); }
  .plate .av.clock span { position: relative; }
  .plate .nm { color: #fff; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 2px #000, 0 0 6px rgba(0,0,0,.87); }
  .plate .nm.off { color: #ffb3b3; }
  .plate .sub { color: rgba(255,255,255,.7); font-weight: 500; white-space: nowrap; }
  .plate.col { flex-direction: column; gap: 3px; padding: 6px 8px; border-radius: 14px; text-align: center; }
  .plate.col .nm { max-width: 100%; }
  .chip { width: 110px; }
  /* HUD chrome (GlassContainer #1F1730 @85%, radius 13; accent #F5C451) */
  .hud { position: absolute; display: flex; align-items: center; gap: 8px; z-index: 80; }
  .glass { background: rgba(31,23,48,.85); border-radius: 13px; padding: 6px 10px; color: #fff; display: flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12px; }
  .glass .num { font-weight: 900; color: #F5C451; font-variant-numeric: tabular-nums; font-size: 13px; }
  .timer { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 12px; }
  .timer.ok { color: #69F0AE; } .timer.warn { color: #FFAB40; } .timer.crit { color: #FF5252; font-size: 14px; }
  .vs { background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.12); border-radius: 22px; padding: 5px 10px; display: flex; align-items: center; gap: 6px; color: #fff; font-size: 12px; font-weight: 600; }
  .vs .v { color: #FFD54F; font-weight: 800; letter-spacing: .5px; padding: 0 6px; font-size: 13px; }
  .vs .mini { display: inline-flex; align-items: center; gap: 5px; }
  .mini .av { width: 26px; height: 26px; border-radius: 50%; background: rgba(21,16,36,.9); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
  .mini .av.bot { background: #1D4E73; }
  .chip { width: 90px; background: rgba(31,23,48,.85); border-radius: 13px; padding: 4px 8px; display: flex; align-items: center; gap: 6px; color: #fff; border: 1.5px solid transparent; }
  .chip .av { width: 24px; height: 24px; border-radius: 50%; background: rgba(21,16,36,.9); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none; }
  .chip .av.bot { background: #1D4E73; }
  .chip .col { min-width: 0; }
  .chip .n { font-size: 10px; color: rgba(255,255,255,.72); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
  .chip .s { font-size: 13px; font-weight: 900; color: #F5C451; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .chip.turn { border-color: rgba(245,196,81,.75); }
  .badgeburaco { position: absolute; background: #F5C451; color: #3a2a00; font-weight: 900; font-size: 10px; padding: 1px 5px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .board .empty-board { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfe8db; font-size: 14px; z-index: 2; }
  .board-note { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin: 8px 0 12px; }
  .board-note b { color: var(--text); font-weight: 500; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  /* ---- lobby (room not dealt yet) ---- */
  .lobby { background: var(--panel2); border-radius: 12px; padding: 16px 18px; }
  .lobby .lh { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; }
  .lobby .lh .t { font-size: 16px; font-weight: 600; }
  .lobby .lh .hint { font-size: 12.5px; }
  .seatgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .seatcard { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 10px; padding: 10px 12px; min-height: 62px; }
  .seatcard.empty { background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); color: var(--muted); justify-content: center; font-size: 13px; }
  .seatcard.offline { opacity: .7; }
  .seatcard .av { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; flex: none; background: #3b6fd6; }
  .seatcard .av.teamB { background: #c98a2e; }
  .seatcard .av.bot { background: #1D4E73; }
  .seatcard .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .seatcard .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .seatcard .meta .on { color: var(--ok); } .seatcard .meta .off { color: var(--danger); }
  .lobby .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
  .lobby .facts b { color: var(--text); font-weight: 500; }

  /* ---- tools under the board ---- */
  .tools { display: block; }
  .tool-card { background: var(--panel2); border-radius: 12px; padding: 12px 14px; }
  .tool-card .th { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 4px; flex-wrap: wrap; }
  .tool-card .th .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
  .tool-card .how { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .tool-card .how b { color: var(--text); font-weight: 500; }
  .tool-card .lbl { font-size: 12px; color: var(--muted); margin: 8px 0 5px; }
  .change-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .change-form input { flex: 1; min-width: 200px; font-family: var(--mono); }
  .preview { margin-top: 8px; min-height: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .preview .err { color: #ffb3b3; font-size: 12px; }
  .preview .legend { font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 3px 0 8px; vertical-align: -1px; }
  .legend i.deck { background: var(--ok); } .legend i.well { background: var(--warn); } .legend i.hand { background: #8b98ab; } .legend i.none { background: var(--danger); }
  .fan { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-height: 20px; }
  .fan .none { color: var(--muted); font-size: 12px; font-style: italic; }
  /* small inline card used in previews / story (same face rules, fixed size) */
  .cf {
    display: inline-flex; flex-direction: column; justify-content: space-between;
    width: 36px; height: 50px; border-radius: 5px; padding: 3px 4px;
    background: #F7F6F3; color: #16181d; font-weight: 700; font-size: 13px; line-height: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.08); position: relative; flex: none;
  }
  .cf .r { font-size: 13px; }
  .cf .s { align-self: flex-end; font-size: 15px; }
  .cf.red { color: #C62828; }
  .cf.joker { background: linear-gradient(150deg, #ffe08a, #ff9a6b); color: #3a1d0b; }
  .cf.sm { width: 30px; height: 42px; font-size: 11px; padding: 2px 3px; }
  .cf.sm .r { font-size: 11px; } .cf.sm .s { font-size: 13px; }
  .cf.xs { width: 24px; height: 32px; font-size: 9px; padding: 2px; border-radius: 4px; }
  .cf.xs .r { font-size: 9px; } .cf.xs .s { font-size: 10px; }
  .cf.ghost { opacity: .75; }
  .cf.src-deck { box-shadow: 0 0 0 2px var(--ok); }
  .cf.src-well { box-shadow: 0 0 0 2px var(--warn); }
  .cf.src-hand { box-shadow: 0 0 0 2px #8b98ab; }
  .cf.src-none { box-shadow: 0 0 0 2px var(--danger); opacity: .45; }
  .cf.src-none::after { content: ''; position: absolute; left: 4px; right: 4px; top: 50%; border-top: 2px solid var(--danger); transform: rotate(-20deg); }

  /* ---- the story (game logs) ---- */
  .logs-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .logs-toolbar select { max-width: 100%; }
  .logs-toolbar input[type=text] { min-width: 160px; }
  .logs-toolbar #logs-room { max-width: 460px; }
  .hint.dim { display: none; }
  .logs-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; min-height: 16px; }
  .logview { background: #0a0d12; border-radius: 10px; padding: 8px 10px; height: 64vh; min-height: 280px; overflow: auto; }
  .logview.raw { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .logview .ln { padding: 1px 0; border-bottom: 1px solid rgba(42,51,66,.25); }
  .logview .ln .t { color: var(--muted); }
  .logview .ln .lv { display: inline-block; min-width: 46px; font-weight: 600; }
  .logview .ln.ERROR .lv { color: var(--danger); }
  .logview .ln.ERROR .m { color: #ffb3b3; }
  .logview .ln.WARN .lv { color: var(--warn); }
  .logview .ln.INFO .lv { color: var(--accent); }
  .logview .ln.DEBUG .lv, .logview .ln.DEBUG .m { color: var(--muted); }
  .logview .ln .d { color: #6f7d92; display: block; padding-left: 18px; }
  .logview .ln.hit { background: rgba(255,180,84,.08); }
  .logview .empty { padding: 40px 0; }
  .logview.human { font-size: 13.5px; line-height: 1.6; }
  .logview.human .ev { display: flex; gap: 10px; align-items: flex-start; padding: 5px 4px; border-bottom: 1px solid rgba(42,51,66,.35); }
  .logview.human .ev .t { color: var(--muted); font-family: var(--mono); font-size: 11px; min-width: 88px; padding-top: 4px; }
  .logview.human .ev .ic { width: 22px; text-align: center; flex: none; padding-top: 1px; }
  .logview.human .ev .body { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .logview.human .ev .body b { color: var(--text); }
  .logview.human .ev .sub { color: var(--muted); font-size: 12px; width: 100%; }
  .logview.human .ev.WARN .body { color: var(--warn); }
  .logview.human .ev.ERROR .body { color: #ffb3b3; }
  .logview.human .ev.turn { background: rgba(79,140,255,.06); }
  .logview.human .ev.end { background: rgba(61,214,140,.08); }
  .logview.human .ev.life .body { color: var(--muted); font-size: 12.5px; }
  .logview.human .ev .tag { font-family: var(--mono); font-size: 10px; color: var(--muted); background: var(--panel2); border-radius: 4px; padding: 1px 6px; }
  .logview.human .ev .seat { color: var(--muted); font-size: 12px; }
  .logview.human .divider { display: flex; align-items: center; gap: 10px; color: #9dbdff; font-size: 12px; padding: 8px 4px 2px; }
  .logview.human .divider::before, .logview.human .divider::after { content: ''; flex: 1; border-top: 1px solid rgba(79,140,255,.25); }
</style>
</head>
<body>

<header>
  <h1>🃏 Brazilia <span>Dev Console</span></h1>
  <span id="env-badge" class="badge neutral">—</span>
  <span id="maintenance-badge" class="badge neutral">maintenance: unknown</span>
  <div class="spacer"></div>
  <button id="btn-ops">Server</button>
  <div class="secret-box">
    <input type="password" id="secret" placeholder="webhook secret" autocomplete="off">
    <button class="primary" id="btn-save-secret">Connect</button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <div class="side-h">Games <span class="hint dim" id="rooms-refresh"></span></div>
    <div id="rooms-list"><div class="empty">Connect to see games</div></div>
    <div class="side-h">Finished</div>
    <div id="ended-list"><div class="empty">—</div></div>
  </aside>

  <section>
    <div class="panel" id="workspace">
      <div class="ws-head">
        <span class="room-id" id="ws-room-id">—</span>
        <button class="small ghost" id="btn-copy-id" title="copy room id" disabled>copy</button>
        <div class="spacer"></div>
        <label class="chk" title="stop refreshing the table">
          <input type="checkbox" id="detail-pause"> pause
        </label>
        <div class="tabs">
          <button id="tab-detail" class="active">Table</button>
          <button id="tab-logs">Story</button>
        </div>
      </div>

      <div class="tab-pane active" id="pane-detail">
        <div class="empty" id="detail-empty">Pick a game</div>
        <div id="detail-body" style="display:none">
          <div class="lobby" id="lobby" style="display:none"></div>
          <div class="board-wrap" id="board-wrap"><div class="board" id="board"></div></div>
          <div class="board-note" id="board-note"></div>
          <div class="tools" id="tools"></div>
          <div class="swapbar" id="swapbar"></div>
        </div>
      </div>

      <div class="tab-pane" id="pane-logs">
        <div class="logs-toolbar">
          <select id="logs-room">
            <option value="">— pick a game —</option>
          </select>
          <input type="text" id="logs-room-manual" placeholder="room id" style="min-width:120px">
          <button class="small" id="btn-logs-open">Open</button>
          <div class="tabs sm">
            <button id="mode-human" class="active">Story</button>
            <button id="mode-raw">Raw log</button>
          </div>
          <select id="logs-level">
            <option value="debug">everything</option>
            <option value="info" selected>info+</option>
            <option value="warn">warnings</option>
            <option value="error">errors</option>
          </select>
          <input type="text" id="logs-q" placeholder="filter">
          <label class="chk"><input type="checkbox" id="logs-follow" checked> follow</label>
          <button class="small" id="btn-logs-reload">Reload</button>
          <button class="small" id="btn-logs-download" disabled>Download</button>
          <span class="hint dim" id="logs-retention"></span>
        </div>
        <div class="logs-meta" id="logs-meta"></div>
        <div class="logview human" id="logview"><div class="empty">Pick a game</div></div>
      </div>
    </div>
  </section>
</main>

<div class="modal-bg" id="ops-modal">
  <div class="modal">
    <div class="mh"><h3>Server</h3><div class="spacer"></div><button class="small" id="btn-ops-close">close</button></div>
    <div class="grid2">
      <div>
        <div class="side-h">Server</div>
        <div class="status-grid" id="server-stats"><div class="empty">not connected</div></div>
      </div>
      <div>
        <div class="side-h">Broadcast</div>
        <div class="row">
          <input type="text" id="ops-message" placeholder="message to players (optional)" style="flex:1;min-width:0">
        </div>
        <div class="row">
          <button class="danger" id="btn-maint-on">Maintenance on</button>
          <button id="btn-maint-off">All clear</button>
        </div>
        <div class="row">
          <button class="warn" id="btn-restart-announce">Announce restart</button>
          <button class="danger" id="btn-restart-real" title="development{restart_server} to every client (they LEAVE the table), then graceful SIGTERM after 3s — needs pm2/systemd to bring it back">Restart process</button>
        </div>
        <div class="row">
          <button class="primary" id="btn-restart-keep" title="server_restarting to every client (they KEEP the table), final snapshot, graceful SIGTERM after 3s; rooms are held on the next boot until a player rejoins — needs pm2/systemd to bring it back">Restart (keep sessions)</button>
        </div>
      </div>
    </div>
    <div class="side-h">Activity</div>
    <div class="log" id="log"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var SECRET_KEY = 'buraco_dev_secret';
  var secret = localStorage.getItem(SECRET_KEY) || '';
  var selectedRoomId = null;
  var pollTimer = null;
  var restarting = false;
  var lastDetail = null; // latest /dev/api/rooms/<id> payload for the selected room

  var $ = function (id) { return document.getElementById(id); };
  var secretInput = $('secret');

  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toast._h);
    toast._h = setTimeout(function () { t.className = 'toast'; }, 3500);
  }

  function log(msg, isErr) {
    var box = $('log');
    var line = document.createElement('div');
    line.className = isErr ? 'err' : 'ok';
    line.textContent = new Date().toLocaleTimeString() + '  ' + msg;
    box.insertBefore(line, box.firstChild);
    while (box.children.length > 80) box.removeChild(box.lastChild);
  }

  function api(path, options) {
    var opts = Object.assign({ headers: { 'x-webhook-secret': secret } }, options || {});
    return fetch(path, opts).then(function (res) {
      return res.text().then(function (text) {
        var body = null;
        try { body = text ? JSON.parse(text) : null; } catch (e) { body = { raw: text }; }
        if (!res.ok) {
          var err = new Error((body && body.error) || ('HTTP ' + res.status));
          err.status = res.status;
          throw err;
        }
        return body;
      });
    });
  }

  function postJson(path, payload) {
    return api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-webhook-secret': secret },
      body: JSON.stringify(payload),
    });
  }

  function fmtTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  }

  function setText(node, text) {
    text = String(text);
    if (node.textContent !== text) node.textContent = text;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function txt(s) { return document.createTextNode(s); }

  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

  function teamName(t) { return t === 'teamA' ? 'Team A' : t === 'teamB' ? 'Team B' : (t || ''); }

  // ---- playing cards ----------------------------------------------------------

  var SUITS = { hearts: '♥', diamonds: '♦', clubs: '♣', spades: '♠' };
  var RED = { hearts: 1, diamonds: 1 };

  function isJoker(c) { return !!c && (c.isJoker || c.rank === 'joker'); }

  function cardLabel(c) {
    if (!c) return '?';
    if (isJoker(c)) return 'JK';
    return c.rank + (SUITS[c.suit] || '?');
  }

  function cardKey(c) { return c.cardId != null ? 'id:' + c.cardId : cardLabel(c); }

  // A card face: rank top-left, suit bottom-right, red suits red, joker gold.
  function cardFace(c, cls) {
    var d = el('span', 'cf' + (isJoker(c) ? ' joker' : RED[c.suit] ? ' red' : '') + (cls ? ' ' + cls : ''));
    if (isJoker(c)) {
      d.appendChild(el('span', 'r', 'JK'));
      d.appendChild(el('span', 's', '★'));
    } else {
      d.appendChild(el('span', 'r', String(c.rank)));
      d.appendChild(el('span', 's', SUITS[c.suit] || '?'));
    }
    d.title = cardLabel(c) + (c.cardId != null ? ' · id ' + c.cardId : '');
    if (c.cardId != null) d.dataset.cid = String(c.cardId);
    return d;
  }

  // Cheap diff: only touch the DOM when the card list actually changed.
  function fillFan(container, cards, opts) {
    opts = opts || {};
    var sig = (cards || []).map(cardKey).join(',') + '|' + (opts.markLast ? 'L' : '') + (opts.markIds || []).join('.') + '|' + (opts.size || '');
    if (container.dataset.sig === sig) return;
    container.dataset.sig = sig;
    container.innerHTML = '';
    if (!cards || !cards.length) {
      container.appendChild(el('span', 'none', opts.emptyText || 'nothing'));
      return;
    }
    var marks = {};
    (opts.markIds || []).forEach(function (id) { marks[String(id)] = 1; });
    cards.forEach(function (c, i) {
      var cls = opts.size || '';
      if (opts.markLast && i === cards.length - 1) cls += ' top';
      if (c.cardId != null && marks[String(c.cardId)]) cls += ' mark';
      container.appendChild(cardFace(c, cls.trim()));
    });
  }

  // ---- shorthand parser (AH / HA / 10C / JK) ----------------------------------

  var RANK_RE = '(10|[AKQJakqj2-9])';
  var SUIT_RE = '([HDCShdcs])';

  function parseToken(tok) {
    var t = tok.trim();
    if (!t) return null;
    if (/^(jk|joker|\*)$/i.test(t)) return { rank: 'joker' };
    var m = t.match(new RegExp('^' + RANK_RE + SUIT_RE + '$', 'i'))
         || t.match(new RegExp('^' + SUIT_RE + RANK_RE + '$', 'i'));
    if (!m) return undefined; // signal: unparsable
    var rank = m[1].toUpperCase();
    var suit = m[2].toUpperCase();
    var suitName = { H: 'hearts', D: 'diamonds', C: 'clubs', S: 'spades' }[suit];
    return { suit: suitName, rank: rank };
  }

  function parseCardSpec(text) {
    var trimmed = (text || '').trim();
    if (!trimmed) return { error: 'empty' };
    if (trimmed[0] === '[') {
      try {
        var arr = JSON.parse(trimmed);
        if (Array.isArray(arr) && arr.length) return { cards: arr };
      } catch (e) { /* fall through to shorthand */ }
    }
    var tokens = trimmed.split(/[\s,;]+/).filter(Boolean);
    var cards = [];
    for (var i = 0; i < tokens.length; i++) {
      var parsed = parseToken(tokens[i]);
      if (parsed === undefined) return { error: 'can\'t read "' + tokens[i] + '" — use e.g. AH, 10C, JK' };
      if (parsed) cards.push(parsed);
    }
    if (!cards.length) return { error: 'no cards' };
    return { cards: cards };
  }

  // Mirror of the server's change-cards matching (deck → own hand → wells,
  // one physical instance per request) so the operator sees availability
  // BEFORE submitting. Anything not free is located for the error text.
  function checkAvailability(cards, detail, playerId) {
    if (!detail) return null;
    var me = (detail.players || []).find(function (p) { return String(p.playerId) === String(playerId); });
    var pools = [
      { src: 'deck', cards: detail.deck || [] },
      { src: 'hand', cards: me ? me.hand : [] },
    ];
    (detail.deadPiles || []).forEach(function (pile) { pools.push({ src: 'well', cards: pile }); });
    var used = {};
    var hit = function (req, c) {
      if (req.cardId != null) return String(c.cardId) === String(req.cardId);
      var reqJoker = String(req.rank).toUpperCase() === 'JOKER';
      if (reqJoker) return isJoker(c);
      return c.suit === req.suit && String(c.rank).toUpperCase() === String(req.rank).toUpperCase();
    };
    var locate = function (req) {
      var where = [];
      (detail.players || []).forEach(function (p) {
        if (String(p.playerId) !== String(playerId)) {
          p.hand.forEach(function (c) { if (hit(req, c)) where.push("in " + p.playerName + "'s hand"); });
        }
        (p.melds || []).forEach(function (m) {
          (m.cards || []).forEach(function (c) { if (hit(req, c)) where.push("on the table (" + p.playerName + "'s meld " + (m.index + 1) + ")"); });
        });
      });
      (detail.discardPile || []).forEach(function (c) { if (hit(req, c)) where.push('in the discard pile'); });
      return where;
    };
    return cards.map(function (req) {
      for (var i = 0; i < pools.length; i++) {
        var pool = pools[i];
        for (var j = 0; j < pool.cards.length; j++) {
          var c = pool.cards[j];
          if (c.cardId != null && used[c.cardId]) continue;
          if (hit(req, c)) {
            if (c.cardId != null) used[c.cardId] = 1;
            return { req: req, src: pool.src, card: c };
          }
        }
      }
      var where = locate(req);
      return { req: req, src: null, where: where.length ? where : ['not in the game at all (no copy left)'] };
    });
  }

  // ---- server status / rooms --------------------------------------------------

  function renderStatus(body) {
    var badge = $('maintenance-badge');
    var dev = body.development;
    if (dev && dev.maintenance_mode) {
      badge.textContent = 'maintenance: ON';
      badge.className = 'badge on';
    } else if (dev && dev.restart_server) {
      badge.textContent = 'restart: announced ' + (dev.at || '');
      badge.className = 'badge on';
    } else {
      badge.textContent = 'maintenance: OFF';
      badge.className = 'badge off';
    }
    $('env-badge').textContent = String(body.environment || '?');
    $('env-badge').className = 'badge neutral';
    if (body.shuttingDown) {
      $('env-badge').textContent += ' · shutting down';
      $('env-badge').className = 'badge on';
    }

    var stats = body.stats || {};
    var gl = body.gameLog || {};
    var up = body.uptimeSeconds || 0;
    var fields = [
      ['node', body.nodeId],
      ['pid', body.pid],
      ['uptime', up >= 3600 ? Math.floor(up / 3600) + 'h ' + Math.floor((up % 3600) / 60) + 'm' : Math.floor(up / 60) + 'm'],
      ['rooms', (stats.totalRooms || 0) + ' (' + (stats.activeRooms || 0) + ' live)'],
      ['players', stats.totalPlayers || 0],
      ['sockets', stats.activeSockets || 0],
      ['game logs', plural(gl.rooms || 0, 'game') + ' · ' + plural(gl.entries || 0, 'line')],
      ['kept for', gl.retentionMs ? Math.round(gl.retentionMs / 3600000 * 10) / 10 + 'h' + (gl.fileEnabled ? ' + on disk' : '') : '—'],
    ];
    var grid = $('server-stats');
    grid.innerHTML = '';
    fields.forEach(function (f) {
      var d = el('div', 'stat');
      d.appendChild(el('div', 'k', f[0]));
      var v = el('div', 'v', f[1]);
      v.title = String(f[1]);
      d.appendChild(v);
      grid.appendChild(d);
    });
  }

  function statusBadge(r) {
    var s = String(r.status || '');
    var cls = r.inProgress ? 'live' : (s === 'waiting' ? 'waiting' : 'ended');
    var label = r.inProgress ? 'playing' : s === 'waiting' ? 'lobby' : s;
    return el('span', 'badge ' + cls, label + (r.awaitingNextRound ? ' · next round soon' : ''));
  }

  function seatsText(r) {
    if (r.seats && r.seats.length) {
      return r.seats.map(function (s) { return s.name + (s.isBot ? ' 🤖' : '') + (s.connected ? '' : ' (offline)'); }).join(', ');
    }
    return r.playerCount + '/' + r.maxPlayers;
  }

  // Sidebar game list, keyed by roomId and patched in place (a full re-render
  // every 2s replaced the item under the cursor, so clicks landed on nothing).
  function renderRooms(body) {
    var list = $('rooms-list');
    var rooms = (body && body.rooms) || [];
    if (!rooms.length) {
      list.innerHTML = '<div class="empty">no live games</div>';
      return;
    }
    if (list.querySelector('.empty')) list.innerHTML = '';
    var seen = {};
    rooms.forEach(function (r) {
      seen[r.roomId] = true;
      var item = null;
      var items = list.querySelectorAll('.room-item');
      for (var i = 0; i < items.length; i++) { if (items[i].dataset.roomId === r.roomId) { item = items[i]; break; } }
      if (!item) {
        item = el('button', 'room-item');
        item.dataset.roomId = r.roomId;
        var r1 = el('div', 'r1'); r1.appendChild(el('span', 'rid')); r1.appendChild(el('span', 'st'));
        item.appendChild(r1);
        item.appendChild(el('div', 'r2'));
        item.appendChild(el('div', 'r3'));
        item.onclick = function () {
          selectRoom(item.dataset.roomId);
          showTab('detail');
          gameLogs.open(item.dataset.roomId, { quiet: true });
        };
        list.appendChild(item);
      }
      item.classList.toggle('selected', r.roomId === selectedRoomId);
      setText(item.querySelector('.rid'), r.name || r.roomId);
      var b = statusBadge(r); b.classList.add('tiny');
      var st = item.querySelector('.st');
      if (!st.firstChild || st.firstChild.className !== b.className || st.firstChild.textContent !== b.textContent) { st.innerHTML = ''; st.appendChild(b); }
      setText(item.querySelector('.r2'), seatsText(r) + ' (' + r.playerCount + '/' + r.maxPlayers + ')');
      var turnSeat = (r.seats || []).find(function (x) { return x.seat === r.currentTurn; });
      var bits = [];
      if (r.cardsDealt) bits.push('turn: ' + (turnSeat ? turnSeat.name : 'seat ' + r.currentTurn));
      if (r.deckCount != null) bits.push('deck ' + r.deckCount);
      if (r.deadPileCounts && r.deadPileCounts.length) bits.push('wells ' + r.deadPileCounts.join('/'));
      setText(item.querySelector('.r3'), bits.join(' · ') || 'waiting in the lobby');
    });
    Array.prototype.slice.call(list.querySelectorAll('.room-item')).forEach(function (it) { if (!seen[it.dataset.roomId]) list.removeChild(it); });
  }

  // Finished games whose story is still kept (from /dev/api/logs).
  function renderEnded(rows) {
    var list = $('ended-list');
    var ended = (rows || []).filter(function (r) { return !r.live; }).slice(0, 12);
    if (!ended.length) { list.innerHTML = '<div class="empty">—</div>'; return; }
    if (list.querySelector('.empty')) list.innerHTML = '';
    var seen = {};
    ended.forEach(function (r) {
      seen[r.roomId] = true;
      var item = null;
      var items = list.querySelectorAll('.room-item');
      for (var i = 0; i < items.length; i++) { if (items[i].dataset.roomId === r.roomId) { item = items[i]; break; } }
      if (!item) {
        item = el('button', 'room-item ended');
        item.dataset.roomId = r.roomId;
        var r1 = el('div', 'r1'); r1.appendChild(el('span', 'rid', r.roomId)); r1.appendChild(el('span', 'badge tiny ended', 'finished'));
        item.appendChild(r1);
        item.appendChild(el('div', 'r3'));
        item.onclick = function () {
          selectRoom(item.dataset.roomId);
          showTab('logs');
          gameLogs.open(item.dataset.roomId);
        };
        list.appendChild(item);
      }
      item.classList.toggle('selected', r.roomId === selectedRoomId);
      setText(item.querySelector('.r3'), plural(r.count || 0, 'line') + (r.errors ? ' · ' + plural(r.errors, 'error') : '') + (r.warns ? ' · ' + plural(r.warns, 'warning') : '') + ' · ' + fmtTime(r.lastAt).slice(0, 8));
    });
    Array.prototype.slice.call(list.querySelectorAll('.room-item')).forEach(function (it) { if (!seen[it.dataset.roomId]) list.removeChild(it); });
  }

  function selectRoom(roomId) {
    var changed = roomId !== selectedRoomId;
    selectedRoomId = roomId;
    setText($('ws-room-id'), roomId || '—');
    $('btn-copy-id').disabled = !roomId;
    document.querySelectorAll('.room-item').forEach(function (it) {
      it.classList.toggle('selected', it.dataset.roomId === roomId);
    });
    swapClear();
    if (changed) {
      lastDetail = null;
      $('board').innerHTML = '';
      $('lobby').innerHTML = '';
      $('tools').innerHTML = '';
      $('board-note').innerHTML = '';
      $('detail-empty').textContent = 'loading…';
    }
    if (roomId) loadDetail(true);
    else clearDetail();
  }

  function clearDetail() {
    $('detail-empty').style.display = '';
    $('detail-body').style.display = 'none';
  }

  // ---- workspace tabs -----------------------------------------------------------

  function showTab(name) {
    $('tab-detail').classList.toggle('active', name === 'detail');
    $('tab-logs').classList.toggle('active', name === 'logs');
    $('pane-detail').classList.toggle('active', name === 'detail');
    $('pane-logs').classList.toggle('active', name === 'logs');
    if (name === 'logs') gameLogs.onShown();
  }
  $('tab-detail').onclick = function () { showTab('detail'); };
  $('tab-logs').onclick = function () { showTab('logs'); };
  $('btn-copy-id').onclick = function () {
    if (!selectedRoomId) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(selectedRoomId).then(
        function () { toast('roomId copied'); },
        function () { toast('copy failed', true); }
      );
    } else {
      window.prompt('roomId', selectedRoomId);
    }
  };

  // ---- the table: a 1:1 copy of the mobile board (spectator layout) --------------
  //
  // Geometry is the mobile SDK's TableGeometry in Flame world units: the board
  // is 1080 tall, 852/393 wide (2341.4), origin at the centre. Every element
  // below is placed from those numbers, then scaled by --u (px per world unit)
  // on this page. What differs from a real spectator: every hand is face-up.

  var GEO = (function () {
    var H = 1080, W = 852 / 393 * 1080;
    return {
      H: H, W: W,
      tableHeight: 595, feltTop: -375, feltBottom: 220, tableCenterY: -77.5,
      meldTopOffset: 20, meldEdgeInset: 36, meldCenterGap: 56, meldBottomInset: 40,
      northStackY: -464, observedSouthY: 466, northPlateY: -397,
      plateOffsetX: 215, plateEdgeMargin: 8,
      bottomStripOffset: 90, stripH: 170, stripCardH: 168, stripCardW: 120, pozSlot: 180, stripGap: 12, discardRightInset: 10,
      meldCardW: 142.5, meldCardH: 206.15, meldGap: 16, meldCardStep: 112, meldMinStep: 22, meldMinSpacing: 24,
      backW: 96 * 0.82, backH: 138 * 0.82,
      // Chrome is drawn larger than the phone's 34/26 world units: at desktop
      // scale those come out ~19px, unreadable next to face-up cards.
      avatar: 52, nameSize: 30, plateMaxW: 620,
    };
  })();

  var board = $('board');
  var boardU = 0.5; // px per world unit, refreshed on resize
  function measureBoard() {
    var h = board.clientHeight || (board.clientWidth * 393 / 852);
    boardU = h / GEO.H;
    board.style.setProperty('--u', boardU + 'px');
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () { measureBoard(); if (lastDetail) renderBoard(lastDetail); }).observe(board);
  }

  // world → px
  function X(x) { return (x + GEO.W / 2) * boardU; }
  function Y(y) { return (y + GEO.H / 2) * boardU; }
  function px(v) { return (v * boardU) + 'px'; }

  function loadDetail(force) {
    if (!selectedRoomId) return;
    if (!force && $('detail-pause').checked) return;
    var roomId = selectedRoomId;
    api('/dev/api/rooms/' + encodeURIComponent(roomId)).then(function (d) {
      if (!d.success || roomId !== selectedRoomId) return;
      lastDetail = d;
      $('detail-empty').style.display = 'none';
      $('detail-body').style.display = '';
      var inLobby = !d.cardsDealt && !d.inProgress && !d.awaitingNextRound;
      $('lobby').style.display = inLobby ? '' : 'none';
      $('board-wrap').style.display = inLobby ? 'none' : '';
      $('board-note').style.display = inLobby ? 'none' : '';
      $('tools').style.display = inLobby ? 'none' : '';
      if (inLobby) {
        renderLobby(d);
      } else {
        measureBoard();
        renderBoard(d);
        renderTools(d);
      }
    }).catch(function (e) {
      log('table ' + roomId + ': ' + e.message, true);
    });
  }

  function seatOf(d, idx) {
    return (d.players || []).find(function (x) { return x.playerIndex === idx; }) || null;
  }
  function nameOf(d, idx) {
    var p = seatOf(d, idx);
    return p ? p.playerName : ('seat ' + idx);
  }
  function initial(p) { return p.isBot ? '🤖' : String(p.playerName || '?').trim().charAt(0).toUpperCase(); }

  var COURT = { J: 'jack', Q: 'queen', K: 'king' };

  // A board card at world size w×h (already scaled), top-left at world (x, y),
  // optional rotation (deg) about its centre.
  function boardCard(c, x, y, w, h, opts) {
    opts = opts || {};
    var d = el('div', 'pc' + (isJoker(c) ? ' joker' : RED[c.suit] ? ' red' : '') + (opts.cls ? ' ' + opts.cls : ''));
    d.style.left = X(x) + 'px'; d.style.top = Y(y) + 'px';
    d.style.width = px(w); d.style.height = px(h);
    d.style.setProperty('--ch', px(h));
    if (opts.rot) d.style.transform = 'rotate(' + opts.rot + 'deg)';
    if (opts.z != null) d.style.zIndex = opts.z;
    if (opts.covered) d.classList.add('covered');
    var rank = isJoker(c) ? 'JOKER' : String(c.rank);
    d.appendChild(el('span', 'ix' + (rank.length > 1 && !isJoker(c) ? ' wide' : ''), rank));
    if (isJoker(c)) {
      var jimg = document.createElement('img'); jimg.className = 'court'; jimg.src = '/dev/assets/court/joker.png'; jimg.alt = '';
      d.appendChild(jimg);
    } else {
      d.appendChild(el('span', 'ixs', SUITS[c.suit] || '?'));
      d.appendChild(el('span', 'ixb', SUITS[c.suit] || '?'));
      if (COURT[rank]) {
        var img = document.createElement('img'); img.className = 'court';
        img.src = '/dev/assets/court/' + COURT[rank] + '_' + c.suit + '.png'; img.alt = '';
        d.appendChild(img);
      } else if (rank === 'A') {
        d.appendChild(el('span', 'pip', SUITS[c.suit] || '?'));
      } else {
        var pip = el('span', 'pip n');
        pip.appendChild(el('span', null, SUITS[c.suit] || '?'));
        pip.appendChild(el('small', null, rank));
        d.appendChild(pip);
      }
    }
    d.title = cardLabel(c) + (c.cardId != null ? ' · id ' + c.cardId : '');
    if (c.cardId != null && opts.pick) { d.dataset.cid = String(c.cardId); d.classList.add('pick'); }
    return d;
  }

  function badge(x, y, dia, text, fontPx) {
    var b = el('div', 'cntbadge', String(text));
    b.style.left = (X(x) - dia * boardU / 2) + 'px'; b.style.top = (Y(y) - dia * boardU / 2) + 'px';
    b.style.width = px(dia); b.style.height = px(dia); b.style.fontSize = px(fontPx);
    b.style.zIndex = 40;
    return b;
  }

  // Nameplate: avatar (34) + name (26) below, anchored centerLeft/centerRight
  // at (x, y) like SeatPlatePlacement. Active turn → the avatar is the clock.
  function plate(p, x, y, anchor, room, isTurn) {
    var column = anchor === 'col';
    var w = el('div', 'plate' + (isTurn ? ' turn' : '') + (column ? ' col' : ''));
    var av = el('div', 'av' + (p.isBot ? ' bot' : '') + (isTurn ? ' clock' : ''));
    av.style.width = px(GEO.avatar); av.style.height = px(GEO.avatar); av.style.fontSize = px(GEO.avatar * 0.46);
    if (isTurn) {
      var left = Math.max(0, Number(room.turnTimeRemaining) || 0);
      var frac = room.turnTimeLimit ? Math.max(0, Math.min(1, left / room.turnTimeLimit)) : 1;
      var ring = el('div', 'ring');
      var pct = Math.round(frac * 100);
      ring.style.background = 'conic-gradient(' + (room.turnTimeLimit && left <= 5 ? '#E53935' : '#2F8FE0') + ' 0 ' + pct + '%, rgba(16,24,40,.18) ' + pct + '% 100%)';
      av.appendChild(ring);
      av.appendChild(el('span', null, room.turnTimeLimit ? String(left) : '▶'));
      av.style.fontSize = px(GEO.avatar * 0.4);
    } else {
      av.appendChild(el('span', null, initial(p)));
    }
    w.appendChild(av);
    var nm = el('div', 'nm' + (p.isConnected ? '' : ' off'), p.playerName + (p.isBot ? ' 🤖' : ''));
    nm.style.fontSize = px(column ? GEO.nameSize * 0.85 : GEO.nameSize);
    nm.style.maxWidth = px(column ? 140 : GEO.plateMaxW - GEO.avatar - 260);
    w.appendChild(nm);
    if (column) {
      // Side band is 160 world units wide: avatar over name, centred on x.
      w.style.maxWidth = px(156);
      w.style.left = X(x) + 'px'; w.style.top = Y(y) + 'px';
      w.style.transform = 'translate(-50%, -50%)';
      if (!p.isConnected) w.title = 'offline';
      return w;
    }
    if (isTurn) {
      var st = el('span', 'sub', room.hasDrawnCard ? (room.meldedThisTurn ? '· drew, melded' : '· drew') : '· to draw');
      st.style.fontSize = px(GEO.nameSize * 0.7);
      w.appendChild(st);
    } else if (!p.isConnected) {
      var off = el('span', 'sub', '· offline');
      off.style.fontSize = px(GEO.nameSize * 0.7);
      w.appendChild(off);
    }
    var plateH = GEO.avatar + 8;
    w.style.height = px(plateH);
    w.style.maxWidth = px(GEO.plateMaxW);
    w.style.top = (Y(y) - plateH * boardU / 2) + 'px';
    if (anchor === 'right') { w.style.right = (board.clientWidth - X(x)) + 'px'; }
    else if (anchor === 'center') { w.style.left = X(x) + 'px'; w.style.transform = 'translateX(-50%)'; }
    else { w.style.left = X(x) + 'px'; }
    if (!p.isConnected) w.title = 'offline';
    return w;
  }

  // Horizontal face-up row for North/South, cards w×h. The mobile centres a
  // narrow back stack at x=0 with the plate at +215; a face-up row needs more
  // width to stay readable, so it grows LEFT and ends where the plate starts.
  // Returns { nodes, right }: `right` is the row's right edge in world units,
  // so the nameplate can sit just after the cards instead of at a fixed slot
  // (a two-card hand and its plate used to be half a table apart).
  function handRow(cards, cx, cy, w, h, markIds) {
    var out = [];
    var n = cards.length;
    if (!n) return { nodes: out, right: cx };
    var maxW = 760;
    var step = n > 1 ? Math.min(w * 0.78, (maxW - w) / (n - 1)) : 0;
    var total = w + step * (n - 1);
    var rightEdge = GEO.plateOffsetX - 20;
    if (cx + total / 2 > rightEdge) cx = rightEdge - total / 2;
    var marks = {};
    (markIds || []).forEach(function (id) { marks[String(id)] = 1; });
    cards.forEach(function (c, i) {
      var x = cx - total / 2 + i * step;
      var cls = (c.cardId != null && marks[String(c.cardId)]) ? 'restrict' : '';
      out.push(boardCard(c, x, cy - h / 2, w, h, { cls: cls, z: 10 + i, covered: i < n - 1 && step < w, pick: true }));
    });
    return { nodes: out, right: cx + total / 2 };
  }

  // Vertical face-up column for East/West at centre (cx, cy): the mobile lays
  // these as a rotated row, so each card is rotated ±90° and stepped along y.
  function handColumn(cards, cx, cy, w, h, rot) {
    var out = [];
    var n = cards.length;
    if (!n) return out;
    var maxLen = 560;
    var step = n > 1 ? Math.min(w * 0.78, (maxLen - w) / (n - 1)) : 0;
    var total = w + step * (n - 1);
    // A +90° card carries its corner index at the TOP of the column strip, a
    // −90° one at the BOTTOM — so West stacks the other way round (first card
    // on top) to keep every index in the visible strip.
    var topFirst = rot < 0;
    cards.forEach(function (c, i) {
      var y = cy - total / 2 + i * step;
      var z = topFirst ? 10 + (n - i) : 10 + i;
      var covered = step < w && (topFirst ? i > 0 : i < n - 1);
      out.push(boardCard(c, cx - w / 2, y + w / 2 - h / 2, w, h, { rot: rot, z: z, covered: covered, pick: true }));
    });
    return out;
  }

  // Meld zone (MeldAreaComponent): columns packed from the anchored edge,
  // cards stepped vertically by 112 and compressed once they no longer fit.
  function meldZone(melds, zoneLeft, zoneTop, zoneW, zoneH, rightAligned) {
    var out = [];
    var cw = GEO.meldCardW, chh = GEO.meldCardH;
    var n = melds.length;
    if (!n) return out;
    var comfortable = cw + GEO.meldGap;
    var packed = (n - 1) * comfortable + cw;
    var spacing = packed <= zoneW ? comfortable : Math.max(GEO.meldMinSpacing, Math.min(comfortable, (zoneW - cw) / (n - 1)));
    melds.forEach(function (m, i) {
      var cards = m.cards || [];
      var colX = rightAligned ? zoneLeft + zoneW - cw - i * spacing : zoneLeft + i * spacing;
      var gap = cards.length > 1 ? Math.min(GEO.meldCardStep, Math.max(GEO.meldMinStep, (zoneH - chh) / (cards.length - 1))) : GEO.meldCardStep;
      // Overlapping columns must not hide a neighbour's corner index: packed
      // from the left the RIGHT neighbour goes on top, packed from the right the
      // rightmost column goes on top (each index sits at its card's left edge).
      var colZ = rightAligned ? 20 + (n - i) * 20 : 20 + i * 20;
      cards.forEach(function (c, j) {
        out.push(boardCard(c, colX, zoneTop + j * gap, cw, chh, { z: colZ + j, covered: j < cards.length - 1 }));
      });
      if (m.isBuraco) {
        var b = el('div', 'badgeburaco', 'BURACO' + (m.grade && m.grade !== 'clean' ? ' ' + m.grade : ''));
        b.style.left = X(colX) + 'px'; b.style.top = (Y(zoneTop + (cards.length - 1) * gap + chh) - 10 * boardU) + 'px';
        b.style.zIndex = colZ + cards.length + 1;
        out.push(b);
      }
    });
    return out;
  }

  // The room before the deal: who is seated, who is online, the host and the
  // room settings. No table yet — nothing to draw on it.
  function renderLobby(d) {
    var box = $('lobby');
    box.innerHTML = '';
    var players = (d.players || []).slice().sort(function (a, b) { return a.playerIndex - b.playerIndex; });
    var max = d.maxPlayers || Math.max(2, players.length);
    var online = players.filter(function (p) { return p.isConnected; }).length;

    var lh = el('div', 'lh');
    lh.appendChild(el('span', 't', 'Lobby · ' + players.length + '/' + max + ' seats'));
    lh.appendChild(el('span', 'hint', online + ' online' + (players.length - online ? ' · ' + (players.length - online) + ' offline' : '') + ' · ' + (max === 4 ? '2v2' : '1v1')));
    box.appendChild(lh);

    var grid = el('div', 'seatgrid');
    for (var i = 0; i < max; i++) {
      var p = players.find(function (x) { return x.playerIndex === i; });
      if (!p) {
        grid.appendChild(el('div', 'seatcard empty', 'seat ' + i + ' · empty' + (max === 4 ? ' · ' + (i % 2 === 0 ? 'Team A' : 'Team B') : '')));
        continue;
      }
      var card = el('div', 'seatcard' + (p.isConnected ? '' : ' offline'));
      card.appendChild(el('span', 'av' + (p.isBot ? ' bot' : (p.team === 'teamB' ? ' teamB' : '')), initial(p)));
      var col = el('div');
      var nm = el('div', 'nm');
      nm.appendChild(txt(p.playerName + (p.isBot ? ' (bot)' : '')));
      if (p.isHost) nm.appendChild(el('span', 'badge tiny neutral', 'host'));
      if (max === 4) nm.appendChild(el('span', 'badge tiny ' + (p.team || 'neutral'), teamName(p.team)));
      col.appendChild(nm);
      var meta = el('div', 'meta');
      meta.appendChild(txt('seat ' + p.playerIndex + ' · '));
      meta.appendChild(el('span', p.isConnected ? 'on' : 'off', p.isConnected ? '● online' : '● offline'));
      var idSpan = el('span', 'mono', ' · ' + p.playerId); idSpan.style.opacity = '.6';
      meta.appendChild(idSpan);
      col.appendChild(meta);
      card.appendChild(col);
      grid.appendChild(card);
    }
    box.appendChild(grid);

    var facts = el('div', 'facts');
    var add = function (label, value) {
      var sp = el('span'); sp.appendChild(txt(label + ' ')); sp.appendChild(el('b', null, String(value))); facts.appendChild(sp);
    };
    var host = players.find(function (p) { return p.isHost; });
    add('Host', host ? host.playerName : (d.hostPlayerId != null ? d.hostPlayerId : '—'));
    add('Rules', d.ruleset || '—');
    add('To', d.targetScore ? d.targetScore : 'single round');
    add('Timer', d.turnTimeLimit ? d.turnTimeLimit + 's' : 'off');
    if (d.spectatorCount) add('Watching', d.spectatorCount);
    box.appendChild(facts);
  }

  function renderBoard(d) {
    board.innerHTML = '';
    var n = (d.players || []).length;
    var four = n > 2 || d.maxPlayers > 2;
    var sideBand = four ? 320 : 80;
    var tableW = GEO.W - sideBand;
    var feltL = -tableW / 2, feltR = tableW / 2;
    var meldW = tableW / 2 - GEO.meldEdgeInset - GEO.meldCenterGap / 2;
    var meldH = Math.max(360, GEO.tableHeight - GEO.meldTopOffset - GEO.meldBottomInset);
    var meldTop = GEO.feltTop + GEO.meldTopOffset;

    // felt
    var felt = el('div', 'felt');
    felt.style.left = X(feltL) + 'px'; felt.style.top = Y(GEO.feltTop) + 'px';
    felt.style.width = px(tableW); felt.style.height = px(GEO.tableHeight);
    var div = el('div', 'divider');
    div.style.top = px(24); div.style.bottom = px(24);
    felt.appendChild(div);
    board.appendChild(felt);

    if (!d.cardsDealt) {
      board.appendChild(el('div', 'empty-board', d.status === 'waiting' ? 'Lobby — cards not dealt yet' : (d.awaitingNextRound ? 'Between rounds — next deal soon' : 'No cards on the table')));
    }

    // meld zones: team A (even seats) left, team B (odd seats) right
    var teamMelds = { A: [], B: [] };
    (d.players || []).forEach(function (p) {
      var key = p.playerIndex % 2 === 0 ? 'A' : 'B';
      (p.melds || []).forEach(function (m) { teamMelds[key].push(m); });
    });
    meldZone(teamMelds.A, feltL + GEO.meldEdgeInset, meldTop, meldW, meldH, false).forEach(function (e) { board.appendChild(e); });
    meldZone(teamMelds.B, feltR - GEO.meldEdgeInset - meldW, meldTop, meldW, meldH, true).forEach(function (e) { board.appendChild(e); });

    // bottom strip: [pozzetto "+"] [deck] [discard box]
    var stripY = GEO.feltBottom + GEO.bottomStripOffset;
    var pozCX = feltL + GEO.pozSlot / 2;
    var deckCX = feltL + GEO.pozSlot + GEO.stripGap + GEO.stripCardW / 2;
    var discardLeft = deckCX + GEO.stripCardW / 2 + GEO.stripGap;
    var discardW = (tableW / 2 - GEO.discardRightInset) - discardLeft;

    var box = el('div', 'discardbox');
    box.style.left = X(discardLeft) + 'px'; box.style.top = Y(stripY - GEO.stripH / 2 + 14) + 'px';
    box.style.width = px(discardW); box.style.height = px(GEO.stripH - 28);
    board.appendChild(box);

    // Pozzetto "+" like the mobile: one pile rotated 90° behind, one upright in
    // front, ONE count badge in the middle (the front pile's; the back pile's
    // once the front one is gone). A taken slot is a dashed outline.
    var piles = d.deadPiles || [];
    piles.forEach(function (pile, i) {
      var w = el('div', 'well' + (pile.length ? '' : ' taken'));
      w.style.left = (X(pozCX) - GEO.stripCardW * boardU / 2) + 'px'; w.style.top = (Y(stripY) - GEO.stripCardH * boardU / 2) + 'px';
      w.style.width = px(GEO.stripCardW); w.style.height = px(GEO.stripCardH);
      if (i === 0) w.style.transform = 'rotate(90deg)';
      w.style.zIndex = 5 + i;
      w.title = piles.map(function (pl, k) { return 'well ' + (k + 1) + ': ' + (pl.length ? pl.length + ' cards' : 'taken'); }).join(' · ');
      board.appendChild(w);
    });
    var front = piles.length ? (piles[piles.length - 1].length ? piles[piles.length - 1] : piles[0]) : null;
    if (front && front.length) board.appendChild(badge(pozCX, stripY, 48, front.length, 22));

    var deck = el('div', 'deckback');
    deck.style.left = (X(deckCX) - GEO.stripCardW * boardU / 2) + 'px'; deck.style.top = (Y(stripY) - GEO.stripCardH * boardU / 2) + 'px';
    deck.style.width = px(GEO.stripCardW); deck.style.height = px(GEO.stripCardH);
    deck.title = 'deck: ' + d.deckCount + (d.deck && d.deck.length ? ' · next ' + cardLabel(d.deck[0]) : '');
    if (!d.deckCount) deck.style.opacity = '.25';
    board.appendChild(deck);
    board.appendChild(badge(deckCX, stripY, 52, d.deckCount || 0, 24));

    // discard fan inside the box (padding 24), newest on the right, top outlined
    var pile = d.discardPile || [];
    var lockIds = [];
    (d.players || []).forEach(function (p) { if (p.discardLock && p.discardLock.cardIds) lockIds = lockIds.concat(p.discardLock.cardIds); });
    if (pile.length) {
      var avail = discardW - 48;
      var step = pile.length > 1 ? Math.min(60, (avail - GEO.stripCardW) / (pile.length - 1)) : 0;
      var total = GEO.stripCardW + step * (pile.length - 1);
      var startX = discardLeft + 24; // packs from the LEFT of the box, like the mobile
      pile.forEach(function (c, i) {
        var cls = (i === pile.length - 1 ? 'top' : '') + (c.cardId != null && lockIds.indexOf(c.cardId) !== -1 ? ' lock' : '');
        board.appendChild(boardCard(c, startX + i * step, stripY - GEO.stripCardH / 2, GEO.stripCardW, GEO.stripCardH, { cls: cls.trim(), z: 10 + i, covered: i < pile.length - 1 && step < GEO.stripCardW }));
      });
    }

    // seats: 0 south, 1 north (1v1) / east (2v2), 2 north, 3 west
    var restrict = d.drawnCardRestriction || [];
    (d.players || []).forEach(function (p) {
      var isTurn = !!d.inProgress && d.currentTurn === p.playerIndex;
      var marks = isTurn ? restrict : [];
      var seatPos = p.playerIndex === 0 ? 'south' : (!four ? 'north' : (p.playerIndex === 1 ? 'east' : p.playerIndex === 2 ? 'north' : 'west'));
      var nodes = [];
      if (seatPos === 'south') {
        var sr = handRow(p.hand, 0, GEO.observedSouthY, GEO.backW, GEO.backH, marks);
        nodes = sr.nodes;
        nodes.push(plate(p, Math.min(GEO.plateOffsetX, sr.right + 24), GEO.observedSouthY, 'left', d, isTurn));
      } else if (seatPos === 'north') {
        var nr = handRow(p.hand, 0, GEO.northStackY, GEO.backW, GEO.backH, marks);
        nodes = nr.nodes;
        nodes.push(plate(p, Math.min(GEO.plateOffsetX, nr.right + 24), GEO.northStackY, 'left', d, isTurn));
      } else if (seatPos === 'east') {
        var ex = Math.min(tableW / 2 + 28 + GEO.backH / 2, GEO.W / 2 - GEO.backH / 2 - 6);
        nodes = handColumn(p.hand, ex, GEO.tableCenterY, GEO.backW, GEO.backH, 90);
        nodes.push(plate(p, (tableW / 2 + GEO.W / 2) / 2, GEO.feltBottom + 78, 'col', d, isTurn));
      } else {
        var wx = Math.max(-tableW / 2 - 28 - GEO.backH / 2, -GEO.W / 2 + GEO.backH / 2 + 6);
        nodes = handColumn(p.hand, wx, GEO.tableCenterY, GEO.backW, GEO.backH, -90);
        nodes.push(plate(p, -(tableW / 2 + GEO.W / 2) / 2, GEO.feltBottom + 78, 'col', d, isTurn));
      }
      nodes.forEach(function (e) { board.appendChild(e); });
    });

    // HUD — top-left timer chip (logical px: 6 top / 8 side at the design size).
    var lp = boardU * 1080 / 393; // px per logical px
    var topPad = 6 * lp, sidePad = 8 * lp;
    if (d.inProgress && d.turnTimeLimit) {
      var left = Math.max(0, Number(d.turnTimeRemaining) || 0);
      var hudLeft = el('div', 'hud'); hudLeft.style.left = sidePad + 'px'; hudLeft.style.top = topPad + 'px';
      var g = el('div', 'glass');
      g.appendChild(el('span', 'timer ' + (left > 10 ? 'ok' : left > 5 ? 'warn' : 'crit'), '⏱ ' + left + 's'));
      hudLeft.appendChild(g);
      board.appendChild(hudLeft);
    }
    // "A VS B" header. The mobile centres it over the North BACK stack; that
    // stack is face-up here, so the pill takes the bottom-left corner (the
    // mobile's chat toggle spot), which nothing else uses on this board.
    var vs = el('div', 'vs');
    var sorted = (d.players || []).slice().sort(function (a, b) { return a.playerIndex - b.playerIndex; });
    var evens = sorted.filter(function (p) { return p.playerIndex % 2 === 0; });
    var odds = sorted.filter(function (p) { return p.playerIndex % 2 === 1; });
    var mini = function (p) {
      var m = el('span', 'mini');
      m.appendChild(el('span', 'av' + (p.isBot ? ' bot' : ''), initial(p)));
      m.appendChild(el('span', null, p.playerName + (p.isBot ? ' 🤖' : '')));
      return m;
    };
    evens.forEach(function (p) { vs.appendChild(mini(p)); });
    vs.appendChild(el('span', 'v', 'VS'));
    odds.forEach(function (p) { vs.appendChild(mini(p)); });
    var vsWrap = el('div', 'hud'); vsWrap.style.left = sidePad + 'px'; vsWrap.style.bottom = topPad + 'px';
    vsWrap.appendChild(vs);
    board.appendChild(vsWrap);

    // HUD — top-right: viewers + score chips (+ match progress)
    var right = el('div', 'hud'); right.style.right = sidePad + 'px'; right.style.top = topPad + 'px'; right.style.flexDirection = 'column'; right.style.alignItems = 'flex-end';
    var row = el('div', 'hud'); row.style.position = 'static';
    var viewers = el('div', 'glass'); viewers.appendChild(el('span', null, '👁')); viewers.appendChild(el('span', 'num', String(d.spectatorCount || 0)));
    row.appendChild(viewers);
    var sides = four
      ? [{ label: 'teamA', seats: evens }, { label: 'teamB', seats: odds }]
      : sorted.map(function (p) { return { label: p.team, seats: [p] }; });
    sides.forEach(function (side) {
      if (!side.seats.length) return;
      var chip = el('div', 'chip' + (d.inProgress && side.seats.some(function (p) { return p.playerIndex === d.currentTurn; }) ? ' turn' : ''));
      var p0 = side.seats[0];
      chip.appendChild(el('span', 'av' + (p0.isBot ? ' bot' : ''), initial(p0)));
      var col = el('span', 'col');
      col.appendChild(el('div', 'n', side.seats.map(function (p) { return p.playerName; }).join(' & ')));
      var ts = d.teamScores || {};
      var score = four ? (ts[side.label] != null ? ts[side.label] : 0) : (p0.score != null ? p0.score : (ts[p0.team] || 0));
      col.appendChild(el('div', 's', String(score)));
      chip.appendChild(col);
      row.appendChild(chip);
    });
    right.appendChild(row);
    if (d.targetScore) {
      var prog = el('div', 'glass'); prog.style.padding = '4px 10px'; prog.style.marginTop = '4px';
      var tsc = d.teamScores || {};
      prog.appendChild(el('span', 'num', '🏆 A ' + (tsc.teamA || 0) + ' · B ' + (tsc.teamB || 0) + ' / ' + d.targetScore));
      right.appendChild(prog);
    }
    board.appendChild(right);

    // note line under the board
    var noteEl = $('board-note');
    noteEl.innerHTML = '';
    var add = function (label, value) {
      var sp = el('span'); sp.appendChild(txt(label + ' ')); sp.appendChild(el('b', null, String(value))); noteEl.appendChild(sp);
    };
    add('Round ' + (d.roundNumber || 1), (d.targetScore ? 'to ' + d.targetScore : 'single round') + ' · ' + (d.ruleset || ''));
    if (d.inProgress && d.currentTurn != null) {
      add(nameOf(d, d.currentTurn) + "'s turn", (d.hasDrawnCard ? 'drew' : 'to draw') + (d.meldedThisTurn ? ', melded' : '') + (d.mustMeldCard ? ', must meld ' + cardLabel(d.mustMeldCard) : ''));
    } else if (d.awaitingNextRound) {
      add('', 'between rounds');
    }
    if (d.lastRound && d.lastRound.winnerIndex != null) {
      add('Last round', nameOf(d, d.lastRound.winnerIndex) + ' went out' + (d.lastRound.batidaType ? ' (' + d.lastRound.batidaType + ')' : ''));
    }
    (d.players || []).forEach(function (p) {
      if (p.discardLock) add('🔒 ' + p.playerName, cardLabel(p.discardLock) + ' locked ' + plural(p.discardLock.turnsLeft, 'turn'));
    });

  }

  // ---- tools under the board (give a hand, peek deck/wells) -----------------------
  //
  // Keyed by playerId and patched in place, so the input, its preview and the
  // open/closed state survive every 2s refresh.

  function renderTools(d) {
    var wrap = $('tools');

    // Deck & wells, folded above the players. Opened state survives refreshes
    // because the element is patched, never rebuilt.
    var pools = wrap.querySelector('details.pools');
    if (!pools) {
      pools = document.createElement('details');
      pools.className = 'pools tool-card';
      var sum = el('summary'); sum.appendChild(txt('Deck & wells ')); sum.appendChild(el('span', 'sub'));
      pools.appendChild(sum);
      var body = el('div', 'pools-body');
      body.appendChild(el('div', 'lbl', 'deck, next draw first'));
      body.appendChild(el('div', 'fan deck'));
      pools.appendChild(body);
      wrap.appendChild(pools);
    }
    setText(pools.querySelector('summary .sub'), '· ' + plural(d.deckCount || 0, 'card') + ' in the deck · wells ' + (d.deadPileCounts || []).join(' / '));
    fillFan(pools.querySelector('.fan.deck'), d.deck || [], { size: 'xs', emptyText: 'empty' });
    var pbody = pools.querySelector('.pools-body');
    (d.deadPiles || []).forEach(function (pile, i) {
      var f = pbody.querySelector('.fan.wellfan[data-well="' + i + '"]');
      if (!f) {
        pbody.appendChild(el('div', 'lbl', 'well ' + (i + 1)));
        f = el('div', 'fan wellfan'); f.dataset.well = i; pbody.appendChild(f);
      }
      fillFan(f, pile, { size: 'xs', emptyText: 'taken' });
    });

    var grid = wrap.querySelector('.player-tools');
    if (!grid) { grid = el('div', 'player-tools'); wrap.appendChild(grid); }
    var seen = {};
    (d.players || []).slice().sort(function (a, b) { return a.playerIndex - b.playerIndex; }).forEach(function (p) {
      var pid = String(p.playerId);
      seen[pid] = true;
      var card = null;
      var all = grid.querySelectorAll('.tool-card[data-pid]');
      for (var i = 0; i < all.length; i++) { if (all[i].dataset.pid === pid) { card = all[i]; break; } }
      if (!card) { card = toolCard(p); grid.appendChild(card); }
      setText(card.querySelector('.th .sub'), 'seat ' + p.playerIndex + ' · ' + plural(p.hand.length, 'card') + ' · ' + plural(p.meldGroups, 'meld') + (p.isConnected ? '' : ' · offline'));
      fillFan(card.querySelector('.fan.hand'), p.hand, { size: 'xs', emptyText: 'empty hand' });
      if (typeof card._refreshPreview === 'function') card._refreshPreview();
    });
    Array.prototype.slice.call(grid.querySelectorAll('.tool-card[data-pid]')).forEach(function (c) { if (!seen[c.dataset.pid]) grid.removeChild(c); });
    swapApply();
  }

  // ---- click-to-swap ---------------------------------------------------------
  //
  // Click any card (deck, well, a hand — in the panel or on the board), then
  // a second one: the two trade places. The server refuses cards on the
  // table or in the discard pile, so nothing visible can be rewritten.

  var swapSel = null; // { cardId, label }

  function swapWhere(cardId) {
    var d = lastDetail;
    if (!d) return '';
    if ((d.deck || []).some(function (c) { return String(c.cardId) === cardId; })) return 'deck';
    for (var i = 0; i < (d.deadPiles || []).length; i++) if (d.deadPiles[i].some(function (c) { return String(c.cardId) === cardId; })) return 'well ' + (i + 1);
    for (var j = 0; j < (d.players || []).length; j++) if (d.players[j].hand.some(function (c) { return String(c.cardId) === cardId; })) return d.players[j].playerName + "'s hand";
    return 'the table / discard pile';
  }

  function swapApply() {
    document.querySelectorAll('.sel').forEach(function (n) { n.classList.remove('sel'); });
    var bar = $('swapbar');
    if (!swapSel) { bar.classList.remove('show'); return; }
    document.querySelectorAll('[data-cid="' + swapSel.cardId + '"]').forEach(function (n) { n.classList.add('sel'); });
    bar.innerHTML = '';
    bar.appendChild(el('b', null, swapSel.label));
    bar.appendChild(txt(' from ' + swapSel.where + ' — click another card to swap '));
    var cancel = el('button', 'small ghost', 'cancel');
    cancel.onclick = swapClear;
    bar.appendChild(cancel);
    bar.classList.add('show');
  }

  function swapClear() { swapSel = null; swapApply(); }

  function onCardClick(node) {
    var cid = node.dataset.cid;
    if (!cid || !lastDetail) return;
    var where = swapWhere(cid);
    var label = node.title ? node.title.split(' · ')[0] : cid;
    if (where === 'the table / discard pile') { toast(label + ' is on the table or in the discard pile — those stay put', true); return; }
    if (!swapSel) { swapSel = { cardId: cid, label: label, where: where }; swapApply(); return; }
    if (swapSel.cardId === cid) { swapClear(); return; }
    var a = swapSel;
    postJson('/webhooks/dev-swap-cards', { roomId: selectedRoomId, a: { cardId: a.cardId }, b: { cardId: cid } }).then(function (res) {
      if (!res.success) { toast('Refused: ' + res.error, true); log('swap: ' + res.error, true); return; }
      toast('Swapped ' + a.label + ' (' + a.where + ') ⇄ ' + label + ' (' + where + ')');
      log('swap ' + a.label + ' (' + a.where + ') ⇄ ' + label + ' (' + where + ')');
      swapClear();
      loadDetail(true);
    }).catch(function (e) { toast('Swap failed: ' + e.message, true); });
  }
  $('tools').addEventListener('click', function (e) { var n = e.target.closest('[data-cid]'); if (n) onCardClick(n); });
  $('board').addEventListener('click', function (e) { var n = e.target.closest('.pc[data-cid]'); if (n) onCardClick(n); });

  function toolCard(p) {
    var card = el('div', 'tool-card');
    card.dataset.pid = String(p.playerId);
    var th = el('div', 'th');
    th.appendChild(txt(p.playerName + (p.isBot ? ' 🤖' : '')));
    th.appendChild(el('span', 'sub'));
    card.appendChild(th);
    card.appendChild(el('div', 'fan hand'));
    var typer = document.createElement('details');
    typer.className = 'typehand';
    typer.appendChild(el('summary', null, 'set hand'));
    card.appendChild(typer);
    var how = el('div', 'how');
    how.appendChild(txt('Replaces the whole hand, in this order. Cards come from the deck, a well or this hand.'));
    typer.appendChild(how);
    var form = el('div', 'change-form');
    var input = document.createElement('input');
    input.type = 'text'; input.placeholder = 'AH 2S 10C JK'; input.autocomplete = 'off'; input.spellcheck = false;
    var btn = el('button', 'small primary', 'Set'); btn.disabled = true;
    var clear = el('button', 'small ghost', 'clear');
    form.appendChild(input); form.appendChild(btn); form.appendChild(clear);
    typer.appendChild(form);
    var preview = el('div', 'preview');
    typer.appendChild(preview);

    function refreshPreview() {
      var text = input.value.trim();
      preview.innerHTML = '';
      input.classList.remove('bad');
      if (!text) { btn.disabled = true; return; }
      var parsed = parseCardSpec(text);
      if (parsed.error) {
        btn.disabled = true; input.classList.add('bad');
        preview.appendChild(el('span', 'err', parsed.error));
        return;
      }
      var avail = checkAvailability(parsed.cards, lastDetail, p.playerId);
      var fan = el('div', 'fan');
      var counts = { deck: 0, hand: 0, well: 0, none: 0 };
      var problems = [];
      parsed.cards.forEach(function (c, i) {
        var a = avail ? avail[i] : null;
        var src = a ? (a.src || 'none') : '';
        if (a) counts[src] += 1;
        fan.appendChild(cardFace(c, 'sm ghost' + (src ? ' src-' + src : '')));
        if (a && !a.src) problems.push(cardLabel(c) + ' is ' + a.where[0]);
      });
      preview.appendChild(fan);
      var legend = el('span', 'legend');
      legend.appendChild(txt(plural(parsed.cards.length, 'card')));
      if (avail) {
        legend.appendChild(el('i', 'deck')); legend.appendChild(txt(counts.deck + ' from the deck'));
        legend.appendChild(el('i', 'well')); legend.appendChild(txt(counts.well + ' from a well'));
        legend.appendChild(el('i', 'hand')); legend.appendChild(txt(counts.hand + ' already held'));
        if (counts.none) { legend.appendChild(el('i', 'none')); legend.appendChild(txt(counts.none + ' not available')); }
      }
